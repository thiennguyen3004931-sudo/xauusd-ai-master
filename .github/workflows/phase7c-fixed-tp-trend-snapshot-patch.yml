name: Apply Trend Fixed TP Snapshot Patch

on:
  push:
    branches:
      - feat/phase7c-fixed-tp-additive
    paths:
      - "scripts/.tmp-apply-trend-fixed-tp-snapshot.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/.tmp-apply-trend-fixed-tp-snapshot.mjs
      - name: Commit exact source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts
          git diff --cached --check
          git commit -m "feat: snapshot Trend fixed TP at entry"
          git push origin HEAD:feat/phase7c-fixed-tp-additive
