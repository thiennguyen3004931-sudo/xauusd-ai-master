name: Phase7C Structural SL Full CI
# Scope-full source verification aligned with existing Phase7B/Phase7C CI gates.
# No runtime, ARM, mode, bridge connection, or order mutation.

on:
  push:
    branches:
      - feat/phase7c-structural-sl-monotonicity
    paths:
      - scripts/test-phase7c-structural-sl-monotonicity.mjs
      - scripts/phase7c-stop-monotonicity.mjs
      - scripts/phase7c-sideway-logic.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - .github/workflows/phase7c-structural-sl-full-ci.yml
  pull_request:
    paths:
      - scripts/test-phase7c-structural-sl-monotonicity.mjs
      - scripts/phase7c-stop-monotonicity.mjs
      - scripts/phase7c-sideway-logic.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - .github/workflows/phase7c-structural-sl-full-ci.yml

permissions:
  contents: read

jobs:
  full-ci:
    name: structural-sl-scope-full-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Structural SL contract
        run: node --test ./scripts/test-phase7c-structural-sl-monotonicity.mjs

      - name: Build and test broker/risk/strategy dependencies
        run: |
          pnpm --filter @xauusd/mt5-broker... build
          pnpm --filter @xauusd/risk-engine... build
          pnpm --filter @xauusd/risk-engine typecheck
          pnpm --filter @xauusd/risk-engine test
          pnpm --filter @xauusd/strategy-engine... build
          pnpm --filter @xauusd/strategy-engine typecheck
          pnpm --filter @xauusd/strategy-engine test

      - name: Phase7C execution regressions
        run: |
          node --test scripts/phase7c-sideway-logic.test.mjs
          node --test scripts/phase7c-sideway-execution-guards.test.mjs
          node --test scripts/phase7c-execution-lock.test.mjs
          node --test scripts/phase7c-forward-report.test.mjs

      - name: Build API and Web dependency graphs
        run: |
          pnpm --filter @xauusd/api... build
          pnpm --filter @xauusd/web... build

      - name: Validate Trend controller TypeScript transform
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const ts = require("typescript");
          const source = fs.readFileSync("scripts/run-phase7b-demo-controller.ts", "utf8");
          const transformed = ts.transpileModule(source, {
            fileName: "run-phase7b-demo-controller.ts",
            reportDiagnostics: true,
            compilerOptions: {
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ESNext,
              moduleResolution: ts.ModuleResolutionKind.Bundler,
              verbatimModuleSyntax: false,
            },
          });
          const errors = (transformed.diagnostics || []).filter(
            (diagnostic) => diagnostic.category === ts.DiagnosticCategory.Error,
          );
          if (errors.length) {
            for (const diagnostic of errors) {
              console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, " "));
            }
            process.exit(1);
          }
          fs.writeFileSync(".phase7c-structural-sl-trend-ci.mjs", transformed.outputText, "utf8");
          NODE
          node --check .phase7c-structural-sl-trend-ci.mjs
          rm -f .phase7c-structural-sl-trend-ci.mjs

      - name: Parse modified Node sources
        run: |
          node --check scripts/phase7c-stop-monotonicity.mjs
          node --check scripts/phase7c-sideway-logic.mjs
          node --check scripts/run-phase7c-sideway-controller.mjs

      - name: Broker-clock patch compatibility dry-run
        shell: bash
        run: |
          node scripts/apply-phase7c-broker-clock-fix-local.mjs
          rm -rf .phase7c-broker-clock-ci
          mkdir -p .phase7c-broker-clock-ci/scripts
          cp scripts/run-phase7b-demo-controller.ts .phase7c-broker-clock-ci/scripts/
          cp scripts/run-phase7c-sideway-controller.mjs .phase7c-broker-clock-ci/scripts/
          PHASE7C_BROKER_CLOCK_PATCH_ROOT="$PWD/.phase7c-broker-clock-ci" \
            node scripts/apply-phase7c-broker-clock-fix-local.mjs --apply
          node --check .phase7c-broker-clock-ci/scripts/run-phase7c-sideway-controller.mjs
          rm -rf .phase7c-broker-clock-ci

      - name: Diff hygiene
        run: git diff --check
