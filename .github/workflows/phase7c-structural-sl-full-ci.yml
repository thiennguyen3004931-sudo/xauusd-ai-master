name: Phase7C Structural SL Full CI
# Full repository verification only; no runtime, ARM, mode, bridge, or order mutation.

on:
  push:
    branches:
      - feat/phase7c-structural-sl-monotonicity
    paths:
      - scripts/test-phase7c-structural-sl-monotonicity.mjs
      - scripts/phase7c-stop-monotonicity.mjs
      - scripts/phase7c-sideway-logic.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - .github/workflows/phase7c-structural-sl-full-ci.yml
  pull_request:
    paths:
      - scripts/test-phase7c-structural-sl-monotonicity.mjs
      - scripts/phase7c-stop-monotonicity.mjs
      - scripts/phase7c-sideway-logic.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - .github/workflows/phase7c-structural-sl-full-ci.yml

permissions:
  contents: read

jobs:
  full-ci:
    name: full-repository-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration validation
        run: pnpm check:integration

      - name: Diff hygiene
        run: git diff --check
