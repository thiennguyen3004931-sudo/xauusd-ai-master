name: Phase7C Apply MT5 Deal History Canonical Symbol

on:
  push:
    branches:
      - fix/phase7c-mt5-deal-history-canonical-symbol
    paths:
      - ".github/workflows/phase7c-apply-mt5-deal-history-canonical-symbol.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact production patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py")
          text = path.read_text(encoding="utf-8")
          old = '                    "symbol": row_symbol,\n'
          new = '                    "symbol": self.settings.canonical_symbol(row_symbol),\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one deal-history symbol target, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase7c-apply-mt5-deal-history-canonical-symbol.yml

      - name: Commit minimal production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py
          git commit -m "fix(phase7c): canonicalize MT5 deal history symbol"
          git push origin HEAD:fix/phase7c-mt5-deal-history-canonical-symbol
