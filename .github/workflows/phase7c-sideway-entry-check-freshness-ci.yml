name: Phase7C Sideway Entry Check Freshness CI

on:
  push:
    branches:
      - fix/phase7c-sideway-entry-check-freshness
    paths:
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "scripts/phase7c-sideway-entry-check-freshness.test.mjs"
      - ".github/workflows/phase7c-sideway-entry-check-freshness-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "scripts/phase7c-sideway-entry-check-freshness.test.mjs"
      - ".github/workflows/phase7c-sideway-entry-check-freshness-ci.yml"

permissions:
  contents: read

jobs:
  sideway-entry-check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Sideway entry-check freshness contract
        run: node --import ./apps/api/node_modules/tsx/dist/loader.mjs --test scripts/phase7c-sideway-entry-check-freshness.test.mjs
