name: Phase7C DEMO Migration Disabled LIVE Env CI

on:
  push:
    branches:
      - fix/phase7c-demo-migration-live-env-disabled
    paths:
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-demo-target-live-env-disabled-source.ps1"
      - ".github/workflows/phase7c-demo-target-live-env-disabled-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-demo-target-live-env-disabled-source.ps1"
      - ".github/workflows/phase7c-demo-target-live-env-disabled-ci.yml"

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regression guard with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-demo-target-live-env-disabled-source.ps1

      - name: Regression guard with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-demo-target-live-env-disabled-source.ps1
