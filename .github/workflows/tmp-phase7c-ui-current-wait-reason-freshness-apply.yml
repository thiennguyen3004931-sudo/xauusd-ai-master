name: TEMP Phase7C UI Freshness Apply

on:
  push:
    branches:
      - fix/phase7c-ui-current-wait-reason-freshness
    paths:
      - ".github/workflows/tmp-phase7c-ui-current-wait-reason-freshness-apply.yml"

permissions:
  contents: write

jobs:
  apply-minimal-source-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-ui-current-wait-reason-freshness
      - name: Apply exact minimal patch
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/src/services/phase7c-ui-contract.service.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    const event = String(row.event ?? "");
              if (!event) continue;

              // Submission lifecycle events are not reasons why a strategy is waiting.'''.replace("              ", "    ")
          new = '''    const event = String(row.event ?? "");
              if (!event) continue;
              if (
                event.toUpperCase() === "ENTRY_MODE_BLOCK" &&
                snapshot.generatedAt - Number(row.timestamp) > 30 * 60_000
              ) continue;

              // Submission lifecycle events are not reasons why a strategy is waiting.'''.replace("              ", "    ")
          if old not in text:
              raise SystemExit("expected strategyWaitReasons anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/services/phase7c-ui-contract.service.ts; then
            echo "NO_CHANGES=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/phase7c-ui-contract.service.ts
          git commit -m "fix(phase7c): expire stale entry mode wait reasons"
          git push origin HEAD:fix/phase7c-ui-current-wait-reason-freshness
