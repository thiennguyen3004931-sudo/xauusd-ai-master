name: Phase7C Dead Broker Pre-Web Recovery CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1"
      - "scripts/test-phase7c-dead-broker-preweb-recovery-source.ps1"
      - ".github/workflows/phase7c-dead-broker-preweb-recovery-ci.yml"
  push:
    branches:
      - "fix/phase7c-dead-broker-preweb-recovery"
    paths:
      - "scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1"
      - "scripts/test-phase7c-dead-broker-preweb-recovery-source.ps1"
      - ".github/workflows/phase7c-dead-broker-preweb-recovery-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dead broker pre-Web recovery contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-dead-broker-preweb-recovery-source.ps1
      - name: Dead broker pre-Web recovery contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-dead-broker-preweb-recovery-source.ps1
      - name: Recovery helper parser with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\recover-phase7c-runtime-ready-stable-deploy-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw $errors[0].Message }
      - name: Recovery helper parser with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\recover-phase7c-runtime-ready-stable-deploy-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw $errors[0].Message }
