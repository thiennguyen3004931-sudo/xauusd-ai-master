name: Phase7C HOLD M15 Dedupe CI

on:
  push:
    branches:
      - feat/phase7c-hold-m15-dedupe
    paths:
      - scripts/test-phase7c-hold-m15-dedupe-contract.mjs
      - scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
      - scripts/run-phase7b-telegram-notifier.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - scripts/phase7c-hold-observability.mjs
      - scripts/apply-phase7c-hold-m15-dedupe-patch.mjs
      - scripts/apply-phase7c-hold-m15-dedupe-patch-v2.mjs
      - scripts/apply-phase7c-hold-m15-dedupe-patch-v3.mjs
      - scripts/apply-phase7c-hold-m15-dedupe-patch-v4.mjs
      - scripts/apply-phase7c-hold-m15-dedupe-patch-v5.mjs
      - scripts/apply-phase7c-hold-m15-legacy-cleanup.mjs
      - .github/workflows/phase7c-hold-m15-dedupe-ci.yml
  pull_request:
    paths:
      - scripts/test-phase7c-hold-m15-dedupe-contract.mjs
      - scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
      - scripts/run-phase7b-telegram-notifier.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - scripts/phase7c-hold-observability.mjs
      - .github/workflows/phase7c-hold-m15-dedupe-ci.yml

permissions:
  contents: write

jobs:
  contract:
    name: hold-m15-dedupe-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phase7c-hold-m15-dedupe
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply replacement when branch is still RED
        shell: bash
        run: |
          if grep -q 'holdM15ByTicketReason' ./scripts/run-phase7b-telegram-notifier.mjs; then
            echo 'PHASE7C_HOLD_M15_PATCH=ALREADY_APPLIED'
          else
            node ./scripts/apply-phase7c-hold-m15-dedupe-patch-v5.mjs
          fi

      - name: Remove superseded HOLD dedupe legacy
        shell: bash
        run: |
          if grep -q 'holdSentKeys' ./scripts/run-phase7b-telegram-notifier.mjs || \
             grep -q 'lastHoldObservationKey' ./scripts/run-phase7b-demo-controller.ts || \
             grep -q 'lastHoldObservationKey' ./scripts/run-phase7c-sideway-controller.mjs; then
            node ./scripts/apply-phase7c-hold-m15-legacy-cleanup.mjs
          else
            echo 'PHASE7C_HOLD_M15_LEGACY_CLEANUP=ALREADY_CLEAN'
          fi

      - name: Verify focused contracts
        run: |
          node --check ./scripts/run-phase7b-telegram-notifier.mjs
          node --check ./scripts/run-phase7c-sideway-controller.mjs
          node --test ./scripts/test-phase7c-hold-m15-dedupe-contract.mjs
          node --test ./scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
          git diff --check

      - name: Commit replacement if produced
        shell: bash
        run: |
          if git diff --quiet -- scripts/run-phase7b-telegram-notifier.mjs scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs; then
            echo 'PHASE7C_HOLD_M15_COMMIT=NO_CHANGES'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-telegram-notifier.mjs scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs
          git commit -m "refactor(phase7c): remove superseded HOLD dedupe legacy"
          git push origin HEAD:feat/phase7c-hold-m15-dedupe
