name: Phase7C HOLD M15 Dedupe CI

on:
  push:
    branches:
      - feat/phase7c-hold-m15-dedupe
    paths:
      - scripts/test-phase7c-hold-m15-dedupe-contract.mjs
      - scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
      - scripts/run-phase7b-telegram-notifier.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - scripts/phase7c-hold-observability.mjs
      - .github/workflows/phase7c-hold-m15-dedupe-ci.yml
  pull_request:
    paths:
      - scripts/test-phase7c-hold-m15-dedupe-contract.mjs
      - scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
      - scripts/run-phase7b-telegram-notifier.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - scripts/phase7c-hold-observability.mjs
      - .github/workflows/phase7c-hold-m15-dedupe-ci.yml

permissions:
  contents: read

jobs:
  contract:
    name: hold-m15-dedupe-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: HOLD M15 dedupe contract
        run: node --test ./scripts/test-phase7c-hold-m15-dedupe-contract.mjs

      - name: Existing HOLD Telegram contract
        run: node --test ./scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
