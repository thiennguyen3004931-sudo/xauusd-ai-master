name: Task6 Sideway Entry Conditions Apply

on:
  push:
    branches:
      - feat/phase7c-strategy-entry-conditions
    paths:
      - "scripts/apply-task6-sideway-entry-conditions.py"
      - ".github/workflows/task6-sideway-entry-conditions-apply.yml"

permissions:
  contents: write

jobs:
  apply-tested-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase7c-strategy-entry-conditions
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic production patch
        run: python scripts/apply-task6-sideway-entry-conditions.py
      - name: Verify Sideway contract is GREEN before commit
        run: node scripts/test-phase7c-sideway-strategy-entry-conditions-contract.mjs
      - name: Check Sideway syntax
        run: node --check scripts/run-phase7c-sideway-controller.mjs
      - name: Check diff integrity
        run: git diff --check
      - name: Commit tested production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7c-sideway-controller.mjs
          git diff --cached --quiet && { echo "No production change produced"; exit 1; }
          git commit -m "feat(sideway): enforce configurable strategy entry conditions"
          git push origin HEAD:feat/phase7c-strategy-entry-conditions
