name: Phase7C Web UI Safe Deploy CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/deploy-phase7c-mt5-dashboard-local.ps1"
      - "scripts/run-phase7b-web-autostart.ps1"
      - "scripts/test-phase7b-web-production-runtime-source.ps1"
      - "scripts/test-phase7c-web-client-localization-runtime-source.ps1"
      - "scripts/test-phase7c-web-ui-safe-deploy-source.ps1"
      - "scripts/test-phase7c-web-vi-localization.mjs"
      - ".github/workflows/phase7c-web-ui-safe-deploy-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/deploy-phase7c-mt5-dashboard-local.ps1"
      - "scripts/run-phase7b-web-autostart.ps1"
      - "scripts/test-phase7b-web-production-runtime-source.ps1"
      - "scripts/test-phase7c-web-client-localization-runtime-source.ps1"
      - "scripts/test-phase7c-web-ui-safe-deploy-source.ps1"
      - "scripts/test-phase7c-web-vi-localization.mjs"
      - ".github/workflows/phase7c-web-ui-safe-deploy-ci.yml"

permissions:
  contents: read

jobs:
  source-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Web UI safe deploy assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-ui-safe-deploy-source.ps1

      - name: Production Web runtime assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7b-web-production-runtime-source.ps1

      - name: Client localization performance assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-client-localization-runtime-source.ps1

      - name: Web UI safe deploy assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-ui-safe-deploy-source.ps1

      - name: Production Web runtime assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7b-web-production-runtime-source.ps1

      - name: Client localization performance assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-client-localization-runtime-source.ps1

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Vietnamese localization
        run: node scripts/test-phase7c-web-vi-localization.mjs

      - name: Build Phase7C web
        run: pnpm --filter @xauusd/web build
