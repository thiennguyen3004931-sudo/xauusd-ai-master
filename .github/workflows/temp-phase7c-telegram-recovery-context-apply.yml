name: TEMP Phase7C Telegram Recovery Context Apply

on:
  push:
    branches:
      - fix/phase7c-telegram-recovery-position-context

permissions:
  contents: write

jobs:
  apply-verified-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase7c-telegram-recovery-position-context
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact source patch
        run: node scripts/apply-phase7c-telegram-recovery-context-fix.mjs

      - name: Notifier JavaScript syntax
        run: node --check scripts/run-phase7b-telegram-notifier.mjs

      - name: Focused synthetic regression
        run: node --test scripts/phase7c-trade-notifier-synthetic.test.mjs

      - name: Commit verified production fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/run-phase7b-telegram-notifier.mjs; then
            echo "No notifier source change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-telegram-notifier.mjs
          git commit -m "fix: preserve Telegram recovery position context"
          git push origin HEAD:fix/phase7c-telegram-recovery-position-context
