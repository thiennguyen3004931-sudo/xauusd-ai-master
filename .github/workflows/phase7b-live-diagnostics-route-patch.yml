name: Apply Phase7B LIVE Diagnostics Route Patch

on:
  push:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - '.github/workflows/phase7b-live-diagnostics-route-patch.yml'

permissions:
  contents: write

jobs:
  apply-route-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-legacy-background-cleanup
          fetch-depth: 0
      - name: Patch Phase7B status route
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/routes/phase7b-demo.route.ts")
          text = path.read_text(encoding="utf-8")

          old_import = 'import { getMt5Telemetry } from "../services/mt5.service";'
          new_import = old_import + '\nimport { shouldComputePhase7BEntryDiagnostics } from "../services/phase7b-entry-diagnostics-account-mode";'
          old_condition = '    if (telemetry.reachable && telemetry.health?.accountMode === "demo") {'
          new_condition = '''    if (shouldComputePhase7BEntryDiagnostics({
                reachable: telemetry.reachable,
                accountMode: telemetry.health?.accountMode ?? null,
              })) {'''

          if new_import not in text:
              if text.count(old_import) != 1:
                  raise SystemExit(f"Expected exactly one MT5 telemetry import, found {text.count(old_import)}")
              text = text.replace(old_import, new_import, 1)

          if new_condition not in text:
              if text.count(old_condition) != 1:
                  raise SystemExit(f"Expected exactly one demo-only diagnostics condition, found {text.count(old_condition)}")
              text = text.replace(old_condition, new_condition, 1)

          path.write_text(text, encoding="utf-8")
      - name: Validate patch
        run: |
          git diff --check
          grep -n "shouldComputePhase7BEntryDiagnostics" apps/api/src/routes/phase7b-demo.route.ts
      - name: Commit route patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/phase7b-demo.route.ts
          if git diff --cached --quiet; then
            echo "Route already patched."
            exit 0
          fi
          git commit -m "fix: expose canonical entry diagnostics on LIVE"
          git push origin HEAD:fix/phase7c-legacy-background-cleanup
