name: Phase7C LIVE Activation Preflight CI

on:
  push:
    branches:
      - feat/phase7c-live-activation-preflight
    paths:
      - "scripts/preflight-phase7c-live-activation-local.ps1"
      - "scripts/probe-phase7c-live-readonly-local.ps1"
      - "scripts/test-phase7c-live-activation-preflight-source.ps1"
      - "scripts/verify-phase7c-live-arm-local.ps1"
      - "scripts/test-phase7c-live-arm-verifier-source.ps1"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - ".github/workflows/phase7c-live-activation-preflight-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/preflight-phase7c-live-activation-local.ps1"
      - "scripts/probe-phase7c-live-readonly-local.ps1"
      - "scripts/test-phase7c-live-activation-preflight-source.ps1"
      - "scripts/verify-phase7c-live-arm-local.ps1"
      - "scripts/test-phase7c-live-arm-verifier-source.ps1"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - ".github/workflows/phase7c-live-activation-preflight-ci.yml"

permissions:
  contents: read

jobs:
  live-activation-preflight-source:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-activation-preflight-source.ps1

      - name: Safety assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-activation-preflight-source.ps1

      - name: LIVE ARM verifier source assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-arm-verifier-source.ps1

      - name: LIVE ARM verifier source assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-arm-verifier-source.ps1

      - name: Parse preflight with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\preflight-phase7c-live-activation-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }

      - name: Parse preflight with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\preflight-phase7c-live-activation-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }

      - name: Parse LIVE ARM verifier with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\verify-phase7c-live-arm-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }

      - name: Parse LIVE ARM verifier with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\verify-phase7c-live-arm-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }
