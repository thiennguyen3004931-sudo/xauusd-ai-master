name: Phase7C Per-Attempt Full Relevant Pre-PR CI

on:
  push:
    branches:
      - fix/phase7c-per-attempt-lifecycle-logs
    paths:
      - ".github/workflows/phase7c-per-attempt-full-relevant-prepr-ci.yml"

permissions:
  contents: read

jobs:
  lifecycle-source-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse changed PowerShell launchers and regression
        shell: pwsh
        run: |
          $files = @(
            "scripts/run-phase7c-executor-task-runner-local.ps1",
            "scripts/run-phase7c-executors-local.ps1",
            "scripts/test-phase7c-per-attempt-lifecycle-logs-source.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }; exit 1 }
            Write-Host "PHASE7C_POWERSHELL_PARSE_PASS=$file"
          }
      - name: Per-attempt lifecycle logs contract PS7
        shell: pwsh
        run: .\scripts\test-phase7c-per-attempt-lifecycle-logs-source.ps1
      - name: Per-attempt lifecycle logs contract PS5.1
        shell: powershell
        run: .\scripts\test-phase7c-per-attempt-lifecycle-logs-source.ps1
      - name: Existing lifecycle broker source contract PS7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Existing lifecycle broker source contract PS5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Broker protocol safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1
      - name: Broker ACL source contract
        shell: pwsh
        run: .\scripts\test-phase7c-lifecycle-broker-acl-source.ps1
      - name: Startup runner guard regression
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-guard-local.ps1
      - name: Startup acceptance source regression
        shell: pwsh
        run: .\scripts\test-phase7c-startup-acceptance-source.ps1
      - name: Executor stop order source regression
        shell: pwsh
        run: .\scripts\test-phase7c-executor-stop-order-source.ps1
