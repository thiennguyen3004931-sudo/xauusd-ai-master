name: Phase7C Verifier StrictMode Self Patch

on:
  push:
    branches:
      - fix/phase7c-verifier-strictmode-count
    paths:
      - .github/workflows/phase7c-verifier-strictmode-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact verifier fix
        shell: pwsh
        run: |
          $path = 'scripts/verify-phase7c-executors-local.ps1'
          $source = Get-Content -LiteralPath $path -Raw
          $old = '$taskDrift = if ($startupRunner) { @(Get-Phase7CExecutorTaskDrift -Task $task) } else { @() }'
          $new = '$taskDrift = @(if ($startupRunner) { Get-Phase7CExecutorTaskDrift -Task $task } else { @() })'
          $count = ([regex]::Matches($source, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one verifier assignment to replace. found=$count" }
          $source = $source.Replace($old, $new)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $source, [System.Text.UTF8Encoding]::new($false))

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-phase7c-executors-local.ps1
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: preserve verifier task drift array under StrictMode"
          git push origin HEAD:fix/phase7c-verifier-strictmode-count
