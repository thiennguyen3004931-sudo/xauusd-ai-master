name: TEMP Phase7C Inspector No-Reconnect Apply

on:
  push:
    branches:
      - fix/phase7c-inspector-health-no-reconnect
    paths:
      - ".github/workflows/tmp-phase7c-inspector-no-reconnect-apply.yml"

permissions:
  contents: write

jobs:
  apply-minimal-source-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-inspector-health-no-reconnect

      - name: Apply exact minimal patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_s}: expected exactly one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/inspect-phase7c-live-runtime-local.ps1",
              '''  $health = Invoke-ObservationGet "$bridgeBaseUrl/health" $bridgeHeaders\n''',
              '''  $health = Invoke-ObservationGet "$bridgeBaseUrl/health?reconnect=false" $bridgeHeaders\n''',
          )
          replace_once(
              "scripts/inspect-phase7c-live-runtime-local.ps1",
              '''  $positions = Invoke-ObservationGet "$bridgeBaseUrl/v1/positions?symbol=$escapedSymbol" $bridgeHeaders\n  $orders = Invoke-ObservationGet "$bridgeBaseUrl/v1/orders?symbol=$escapedSymbol" $bridgeHeaders\n''',
              '''  $positions = Invoke-ObservationGet "$bridgeBaseUrl/v1/positions?symbol=$escapedSymbol&reconnect=false" $bridgeHeaders\n  $orders = Invoke-ObservationGet "$bridgeBaseUrl/v1/orders?symbol=$escapedSymbol&reconnect=false" $bridgeHeaders\n''',
          )

          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/app.py",
              '''@app.get("/health", dependencies=[Depends(verify_api_key)])\ndef health():\n    return {\n        **gateway.health(),\n''',
              '''@app.get("/health", dependencies=[Depends(verify_api_key)])\ndef health(reconnect: bool = True):\n    return {\n        **gateway.health(reconnect=reconnect),\n''',
          )
          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/app.py",
              '''@app.get("/v1/positions", dependencies=[Depends(verify_api_key)])\ndef positions(symbol: str | None = Query(default=None)):\n    return normalize_positions(gateway.positions(symbol))\n\n\n@app.get("/v1/orders", dependencies=[Depends(verify_api_key)])\ndef pending_orders(symbol: str | None = Query(default=None)):\n    return gateway.pending_orders(symbol)\n''',
              '''@app.get("/v1/positions", dependencies=[Depends(verify_api_key)])\ndef positions(symbol: str | None = Query(default=None), reconnect: bool = True):\n    return normalize_positions(gateway.positions(symbol, reconnect=reconnect))\n\n\n@app.get("/v1/orders", dependencies=[Depends(verify_api_key)])\ndef pending_orders(symbol: str | None = Query(default=None), reconnect: bool = True):\n    return gateway.pending_orders(symbol, reconnect=reconnect)\n''',
          )

          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py",
              '''    def health(self) -> dict[str, Any]:\n        base = super().health()\n''',
              '''    def health(self, reconnect: bool = True) -> dict[str, Any]:\n        base = super().health(reconnect=reconnect)\n''',
          )
          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py",
              '''                _, account = self._connection_snapshot_locked(reconnect=True)\n''',
              '''                _, account = self._connection_snapshot_locked(reconnect=reconnect)\n''',
          )
          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py",
              '''    def pending_orders(self, canonical_symbol: str | None = None) -> list[dict[str, Any]]:\n        """Read-only broker pending-order snapshot used by LIVE arm preflight."""\n        broker_symbol = self.settings.broker_symbol(canonical_symbol) if canonical_symbol else None\n        with self._lock:\n            rows = (\n                self._read_with_reconnect_locked("orders_get", symbol=broker_symbol)\n                if broker_symbol\n                else self._read_with_reconnect_locked("orders_get")\n            )\n''',
              '''    def pending_orders(\n        self,\n        canonical_symbol: str | None = None,\n        reconnect: bool = True,\n    ) -> list[dict[str, Any]]:\n        """Read-only broker pending-order snapshot used by LIVE arm preflight."""\n        broker_symbol = self.settings.broker_symbol(canonical_symbol) if canonical_symbol else None\n        with self._lock:\n            rows = (\n                self._read_with_reconnect_locked(\n                    "orders_get",\n                    symbol=broker_symbol,\n                    reconnect=reconnect,\n                )\n                if broker_symbol\n                else self._read_with_reconnect_locked("orders_get", reconnect=reconnect)\n            )\n''',
          )

          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py",
              '''    def health(self) -> dict[str, Any]:\n        now = int(time.time() * 1000)\n        with self._lock:\n            terminal, account = self._connection_snapshot_locked(reconnect=True)\n''',
              '''    def health(self, reconnect: bool = True) -> dict[str, Any]:\n        now = int(time.time() * 1000)\n        with self._lock:\n            terminal, account = self._connection_snapshot_locked(reconnect=reconnect)\n''',
          )
          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py",
              '''    def positions(self, canonical_symbol: str | None = None) -> list[dict[str, Any]]:\n        broker_symbol = self.settings.broker_symbol(canonical_symbol) if canonical_symbol else None\n        with self._lock:\n            rows = (\n                self._read_with_reconnect_locked("positions_get", symbol=broker_symbol)\n                if broker_symbol\n                else self._read_with_reconnect_locked("positions_get")\n            )\n''',
              '''    def positions(\n        self,\n        canonical_symbol: str | None = None,\n        reconnect: bool = True,\n    ) -> list[dict[str, Any]]:\n        broker_symbol = self.settings.broker_symbol(canonical_symbol) if canonical_symbol else None\n        with self._lock:\n            rows = (\n                self._read_with_reconnect_locked(\n                    "positions_get",\n                    symbol=broker_symbol,\n                    reconnect=reconnect,\n                )\n                if broker_symbol\n                else self._read_with_reconnect_locked("positions_get", reconnect=reconnect)\n            )\n''',
          )
          replace_once(
              "packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py",
              '''    def _read_with_reconnect_locked(self, method_name: str, *args: Any, **kwargs: Any) -> Any:\n        """Run an idempotent MT5 read and retry once after an IPC reconnect.\n\n        This helper is deliberately not used for order_send. A lost response to\n        a mutating request must never be retried blindly because the broker may\n        already have accepted the original command.\n        """\n        self._ensure_connected_locked()\n        method = getattr(self.mt5, method_name)\n        result = method(*args, **kwargs)\n        if result is not None:\n            return result\n''',
              '''    def _read_with_reconnect_locked(\n        self,\n        method_name: str,\n        *args: Any,\n        reconnect: bool = True,\n        **kwargs: Any,\n    ) -> Any:\n        """Run an idempotent MT5 read and optionally retry after an IPC reconnect.\n\n        This helper is deliberately not used for order_send. A lost response to\n        a mutating request must never be retried blindly because the broker may\n        already have accepted the original command. Setting reconnect=False is\n        reserved for strict observation-only callers.\n        """\n        if reconnect:\n            self._ensure_connected_locked()\n        elif self.mt5 is None:\n            return None\n        method = getattr(self.mt5, method_name)\n        result = method(*args, **kwargs)\n        if result is not None or not reconnect:\n            return result\n''',
          )

      - name: Verify exact production diff
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "$(printf '%s\n' \
            packages/mt5-broker/bridge/mt5_bridge/app.py \
            packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py \
            packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py \
            scripts/inspect-phase7c-live-runtime-local.ps1 | sort | tr '\n' ' ')"

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mt5-broker/bridge/mt5_bridge/app.py \
                  packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py \
                  packages/mt5-broker/bridge/mt5_bridge/mt5_gateway.py \
                  scripts/inspect-phase7c-live-runtime-local.ps1
          git commit -m "fix(phase7c): make inspector reads non-reconnecting"
          git push origin HEAD:fix/phase7c-inspector-health-no-reconnect
