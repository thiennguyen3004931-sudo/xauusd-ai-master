name: Phase7C Structural SL Apply Once

on:
  push:
    branches:
      - codex/phase7c-structural-sl-monotonicity-audit
    paths:
      - .github/workflows/phase7c-structural-sl-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded minimal source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-phase7b-demo-controller.ts")
          source = path.read_text(encoding="utf-8")

          old_import = '''import {
            stopIsAtLeastAsTight,
            stopStrictlyTightens,
          } from "./phase7c-stop-monotonicity.mjs";'''
          new_import = '''import {
            stopIsAtLeastAsTight,
            stopStrictlyTightens,
            tightestKnownStop,
          } from "./phase7c-stop-monotonicity.mjs";'''

          old_trailing = '''      const candidate = roundPrice(structure, spec.digits);
                if (stopStrictlyTightens(managed.side, Number(position.stopLoss), candidate)) {'''
          new_trailing = '''      const candidate = roundPrice(structure, spec.digits);
                const structuralBaseline = tightestKnownStop(
                  managed.side,
                  Number(position.stopLoss),
                  Number(managed.lastStructuralStop),
                );
                if (stopStrictlyTightens(managed.side, structuralBaseline, candidate)) {'''

          if source.count(old_import) != 1:
              raise SystemExit(f"Expected exactly one stop helper import block, got {source.count(old_import)}")
          if source.count(old_trailing) != 1:
              raise SystemExit(f"Expected exactly one structural trailing block, got {source.count(old_trailing)}")

          source = source.replace(old_import, new_import)
          source = source.replace(old_trailing, new_trailing)
          path.write_text(source, encoding="utf-8")
          PY

          git diff --check
          git diff -- scripts/run-phase7b-demo-controller.ts

      - name: Commit minimal source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts
          git commit -m "fix(phase7c): enforce durable trend stop baseline"
          git push origin HEAD:codex/phase7c-structural-sl-monotonicity-audit
