name: Phase7B Wait Pullback CI

on:
  push:
    branches:
      - phase7b-wait-pullback-runtime
  pull_request:
    paths:
      - "packages/risk-engine/**"
      - ".github/workflows/phase7b-wait-pullback-ci.yml"

jobs:
  risk-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build risk-engine dependency graph
        run: pnpm --filter @xauusd/risk-engine... build

      - name: Typecheck risk-engine
        run: pnpm --filter @xauusd/risk-engine typecheck

      - name: Test risk-engine
        run: pnpm --filter @xauusd/risk-engine test
