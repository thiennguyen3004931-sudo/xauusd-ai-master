name: Phase7C MT5 Unmanaged Diagnostic Details Patch Once

on:
  push:
    branches:
      - fix/phase7c-mt5-unmanaged-diagnostic-details
    paths:
      - ".github/workflows/phase7c-mt5-unmanaged-diagnostic-details-patch-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-mt5-unmanaged-diagnostic-details
      - name: Apply exact minimal MT5 diagnostic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mt5/XAUUSD_AI_Master_Decision_Panel.mq5")
          source = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} match count={count}")
              source = source.replace(old, new)

          replace_once(
              '   int bx3 = bx2 + box_w + gap;\n   string entry = managing ? Field(payload, "positionEntry") : Field(payload, "setupEntry");',
              '   int bx3 = bx2 + box_w + gap;\n   string position_state = managing ? Clean(Field(payload, "positionState"), "UNMANAGED") : "SETUP";\n   bool position_unmanaged = managing && position_state == "UNMANAGED";\n   string entry = managing ? Field(payload, "positionEntry") : Field(payload, "setupEntry");',
              "trade-plan state guard",
          )
          replace_once(
              '   string tp2 = managing ? Field(payload, "positionTp2") : Field(payload, "setupTp2");\n   string tp1 = managing ? Field(payload, "positionTp1") : Field(payload, "setupTp1");\n   string strategy = managing ? Field(payload, "positionStrategy") : Field(payload, "setupStrategy");\n   string tp = EmptyValue(tp2) ? tp1 : tp2;\n   string tp_label = strategy == "TREND" && EmptyValue(tp2) ? "MỐC +10" : "TP";',
              '   string tp2 = managing ? (position_unmanaged ? "n/a" : Field(payload, "positionTp2")) : Field(payload, "setupTp2");\n   string tp1 = managing ? (position_unmanaged ? "n/a" : Field(payload, "positionTp1")) : Field(payload, "setupTp1");\n   string strategy = managing ? (position_unmanaged ? "UNMANAGED" : Field(payload, "positionStrategy")) : Field(payload, "setupStrategy");\n   string tp = position_unmanaged ? "n/a" : (EmptyValue(tp2) ? tp1 : tp2);\n   string tp_label = position_unmanaged ? "TP KHÔNG QUẢN LÝ" : (strategy == "TREND" && EmptyValue(tp2) ? "MỐC +10" : "TP");',
              "trade-plan tp guard",
          )
          replace_once(
              "   Card(bx3, y + 12, box_w, 64, C'12,28,20', C'45,140,70');",
              "   Card(bx3, y + 12, box_w, 64, position_unmanaged ? C'35,18,18' : C'12,28,20', position_unmanaged ? clrTomato : C'45,140,70');",
              "tp card tone",
          )
          replace_once(
              '   Text(bx3 + 12, CenteredTextY(y + 14, 22, BODY_FONT_SIZE), tp_label, clrLimeGreen, BODY_FONT_SIZE);',
              '   Text(bx3 + 12, CenteredTextY(y + 14, 22, BODY_FONT_SIZE), tp_label, position_unmanaged ? clrTomato : clrLimeGreen, BODY_FONT_SIZE);',
              "tp label tone",
          )
          replace_once(
              '   TextRight(x + w - 18, top_y, FitText("Lãi/lỗ: " + Clean(Field(payload, "floatingPnlUsd")) + " USD", w / 2 - 30, BODY_FONT_SIZE), clrWhite, BODY_FONT_SIZE);',
              '   string pnl_label = position_unmanaged ? "P/L tham chiếu: " : "Lãi/lỗ: ";\n   TextRight(x + w - 18, top_y, FitText(pnl_label + Clean(Field(payload, "floatingPnlUsd")) + " USD", w / 2 - 30, BODY_FONT_SIZE), clrWhite, BODY_FONT_SIZE);',
              "pnl diagnostic label",
          )

          path.write_text(source, encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase7c-mt5-unmanaged-diagnostic-details-patch-once.yml
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mt5/XAUUSD_AI_Master_Decision_Panel.mq5 .github/workflows/phase7c-mt5-unmanaged-diagnostic-details-patch-once.yml
          git commit -m "fix(phase7c): label MT5 unmanaged position diagnostics"
          git push origin HEAD:fix/phase7c-mt5-unmanaged-diagnostic-details
