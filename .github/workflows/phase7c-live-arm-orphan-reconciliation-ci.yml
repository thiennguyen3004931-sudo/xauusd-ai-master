name: Phase7C LIVE Arm Orphan Reconciliation CI

on:
  push:
    branches:
      - fix/phase7c-live-arm-orphan-reconciliation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-contract-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Orphan reconciliation source contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-arm-orphan-reconciliation-source.ps1
      - name: Orphan reconciliation source contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-arm-orphan-reconciliation-source.ps1

  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Smoke production Node API runtime
        run: node scripts/test-phase7b-api-node-production-runtime.mjs

  existing-live-arm-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Existing LIVE arm source contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-live-arm-demo-auto-source.ps1
      - name: Existing LIVE arm source contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-live-arm-demo-auto-source.ps1
