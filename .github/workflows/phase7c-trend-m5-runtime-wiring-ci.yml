name: Phase7C Trend M5 Runtime Wiring CI

on:
  push:
    branches:
      - fix/phase7c-trend-m5-runtime-wiring
    paths:
      - "scripts/run-phase7c-trend-controller.mjs"
      - "scripts/phase7c-semi-trend-runtime-source-adapter.mjs"
      - "scripts/phase7c-m5-structural-trailing-source-adapter.mjs"
      - "scripts/phase7c-m5-prestructure-profit-lock-source-adapter.mjs"
      - "scripts/phase7c-m5-structural-trailing.mjs"
      - "scripts/phase7c-trend-m5-runtime-wiring.test.mjs"
      - ".github/workflows/phase7c-trend-m5-runtime-wiring-ci.yml"
  pull_request:
    paths:
      - "scripts/run-phase7c-trend-controller.mjs"
      - "scripts/phase7c-semi-trend-runtime-source-adapter.mjs"
      - "scripts/phase7c-m5-structural-trailing-source-adapter.mjs"
      - "scripts/phase7c-m5-prestructure-profit-lock-source-adapter.mjs"
      - "scripts/phase7c-m5-structural-trailing.mjs"
      - "scripts/phase7c-trend-m5-runtime-wiring.test.mjs"
      - ".github/workflows/phase7c-trend-m5-runtime-wiring-ci.yml"

permissions:
  contents: read

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use approved Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Canonical preflight
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=test
          echo "NODE_ENV=$NODE_ENV"
          node --version
          git rev-parse --short HEAD
          status="$(git status --short)"
          printf '%s\n' "$status"
          if [ -n "$status" ]; then
            echo "CANONICAL_PREFLIGHT=BLOCKED_DIRTY_WORKTREE"
            exit 1
          fi
          echo "CANONICAL_PREFLIGHT=PASS"

      - name: Trend M5 runtime wiring canonical contract
        shell: bash
        run: |
          set -o pipefail
          export NODE_ENV=test
          set +e
          node --test scripts/phase7c-trend-m5-runtime-wiring.test.mjs 2>&1 | tee phase7c-trend-m5-runtime-wiring.tap
          code=${PIPESTATUS[0]}
          set -e
          failed="$(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' phase7c-trend-m5-runtime-wiring.tap | tail -n 1)"
          failed="${failed:-UNKNOWN}"
          echo "exit=$code"
          echo "failed=$failed"
          exit "$code"
