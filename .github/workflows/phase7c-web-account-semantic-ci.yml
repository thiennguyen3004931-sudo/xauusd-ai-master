name: Phase7C Web Account Semantic CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/services/mt5-performance.service.ts"
      - "apps/api/src/services/mt5.service.ts"
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "apps/api/src/services/phase7c-decision-monitor.service.ts"
      - "apps/web/src/pages/PerformancePage.tsx"
      - "apps/web/src/pages/Phase7BDemoPage.tsx"
      - "apps/web/src/pages/Phase7BOpsPage.tsx"
      - "apps/web/src/pages/Phase7BPatternCheckPage.tsx"
      - "mt5/XAUUSD_AI_Master_Decision_Panel.mq5"
      - "apps/web/src/phase7c-panel-status.ts"
      - "apps/web/src/types.ts"
      - "apps/web/src/ui/DashboardLayout.tsx"
      - "apps/web/src/ui/StatusChip.tsx"
      - "scripts/test-phase7c-web-account-semantic-source.mjs"
      - ".github/workflows/phase7c-web-account-semantic-ci.yml"

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Account-aware semantic source assertions
        run: node scripts/test-phase7c-web-account-semantic-source.mjs

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: Build Web dependency graph
        run: pnpm --filter @xauusd/web... build
