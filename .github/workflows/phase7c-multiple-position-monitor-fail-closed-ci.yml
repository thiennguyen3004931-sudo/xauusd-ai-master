name: Phase7C Multiple Position Monitor Fail Closed CI

on:
  push:
    branches:
      - fix/phase7c-multiple-position-monitor-fail-closed
    paths:
      - "apps/api/src/services/phase7c-decision-monitor.service.ts"
      - "scripts/phase7c-multiple-position-monitor-fail-closed.test.mjs"
      - ".github/workflows/phase7c-multiple-position-monitor-fail-closed-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/services/phase7c-decision-monitor.service.ts"
      - "scripts/phase7c-multiple-position-monitor-fail-closed.test.mjs"
      - ".github/workflows/phase7c-multiple-position-monitor-fail-closed-ci.yml"

permissions:
  contents: read

jobs:
  multiple-position-monitor-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Multiple-position monitor fail-closed contract
        run: node --import ./apps/api/node_modules/tsx/dist/loader.mjs --test scripts/phase7c-multiple-position-monitor-fail-closed.test.mjs
