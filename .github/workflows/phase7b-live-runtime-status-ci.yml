name: Phase7B LIVE Runtime Status CI

on:
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "apps/api/src/routes/phase7b-demo.route.ts"
      - "apps/api/src/services/phase7b-status-runtime-account-mode.ts"
      - "scripts/phase7b-live-runtime-status.test.mjs"
      - ".github/workflows/phase7b-live-runtime-status-ci.yml"

permissions:
  contents: read

jobs:
  live-runtime-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run LIVE Phase7B runtime status regression
        run: node scripts/phase7b-live-runtime-status.test.mjs
