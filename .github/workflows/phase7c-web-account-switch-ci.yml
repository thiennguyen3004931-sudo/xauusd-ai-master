name: Phase7C Web Account Switch CI

on:
  push:
    branches:
      - feat/phase7c-guarded-web-account-switch
    paths:
      - "apps/api/src/app.ts"
      - "apps/api/src/routes/phase7c-account-switch.route.ts"
      - "apps/api/src/services/phase7c-account-switch.service.ts"
      - "apps/web/src/pages/Phase7CAccountRiskPage.tsx"
      - "apps/web/src/ui/Phase7CAccountSwitchCard.tsx"
      - "apps/web/src/router.tsx"
      - "scripts/register-phase7c-account-switch-task-local.ps1"
      - "scripts/run-phase7c-account-switch-task-runner-local.ps1"
      - "scripts/test-phase7c-web-account-switch-source.ps1"
      - ".github/workflows/phase7c-web-account-switch-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "apps/api/src/app.ts"
      - "apps/api/src/routes/phase7c-account-switch.route.ts"
      - "apps/api/src/services/phase7c-account-switch.service.ts"
      - "apps/web/src/pages/Phase7CAccountRiskPage.tsx"
      - "apps/web/src/ui/Phase7CAccountSwitchCard.tsx"
      - "apps/web/src/router.tsx"
      - "scripts/register-phase7c-account-switch-task-local.ps1"
      - "scripts/run-phase7c-account-switch-task-runner-local.ps1"
      - "scripts/test-phase7c-web-account-switch-source.ps1"
      - ".github/workflows/phase7c-web-account-switch-ci.yml"

permissions:
  contents: read

jobs:
  source-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Guarded account-switch source assertions - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-account-switch-source.ps1
      - name: Guarded account-switch source assertions - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-account-switch-source.ps1

  api-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Build Web
        run: pnpm --filter @xauusd/web build
