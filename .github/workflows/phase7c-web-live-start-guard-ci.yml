name: Phase7C Web LIVE Start Guard CI

on:
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "scripts/test-phase7c-web-live-start-guard-source.mjs"
      - ".github/workflows/phase7c-web-live-start-guard-ci.yml"

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Web LIVE Start fail-closed source assertions
        run: node scripts/test-phase7c-web-live-start-guard-source.mjs

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
