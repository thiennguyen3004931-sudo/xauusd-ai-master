name: Phase7C LIVE Arm Guard CI

on:
  push:
    branches:
      - feat/phase7c-dual-terminal-live-arm-guard
    paths:
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - "packages/mt5-broker/bridge/.env.phase7b-live.example"
      - "packages/mt5-broker/bridge/run.ps1"
      - "packages/mt5-broker/bridge/mt5_bridge/app.py"
      - "packages/mt5-broker/bridge/mt5_bridge/config.py"
      - "packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py"
      - "packages/mt5-broker/bridge/mt5_bridge/live_arm.py"
      - "packages/mt5-broker/bridge/tests/test_live_arm.py"
      - "scripts/arm-phase7c-live-local.ps1"
      - "scripts/configure-phase7c-mt5-terminal-profile-local.ps1"
      - "scripts/disarm-phase7c-live-local.ps1"
      - "scripts/get-phase7c-live-arm-local.ps1"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "scripts/run-phase7c-account-bridge-task-runner-local.ps1"
      - "scripts/test-phase7c-live-arm-source.ps1"
      - ".github/workflows/phase7c-live-arm-guard-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - "packages/mt5-broker/bridge/.env.phase7b-live.example"
      - "packages/mt5-broker/bridge/run.ps1"
      - "packages/mt5-broker/bridge/mt5_bridge/app.py"
      - "packages/mt5-broker/bridge/mt5_bridge/config.py"
      - "packages/mt5-broker/bridge/mt5_bridge/guarded_gateway.py"
      - "packages/mt5-broker/bridge/mt5_bridge/live_arm.py"
      - "packages/mt5-broker/bridge/tests/test_live_arm.py"
      - "scripts/arm-phase7c-live-local.ps1"
      - "scripts/configure-phase7c-mt5-terminal-profile-local.ps1"
      - "scripts/disarm-phase7c-live-local.ps1"
      - "scripts/get-phase7c-live-arm-local.ps1"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "scripts/run-phase7c-account-bridge-task-runner-local.ps1"
      - "scripts/test-phase7c-live-arm-source.ps1"
      - ".github/workflows/phase7c-live-arm-guard-ci.yml"

permissions:
  contents: read

jobs:
  live-arm-python:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install unit-test dependency
        shell: pwsh
        run: python -m pip install "pydantic>=2,<3"

      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -m py_compile .\packages\mt5-broker\bridge\mt5_bridge\config.py
          python -m py_compile .\packages\mt5-broker\bridge\mt5_bridge\live_arm.py
          python -m py_compile .\packages\mt5-broker\bridge\mt5_bridge\guarded_gateway.py
          python -m py_compile .\packages\mt5-broker\bridge\tests\test_live_arm.py

      - name: Run LIVE arm fail-closed unit tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\packages\mt5-broker\bridge
        run: python .\packages\mt5-broker\bridge\tests\test_live_arm.py

  live-arm-source-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source safety assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-arm-source.ps1

      - name: Source safety assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-arm-source.ps1

      - name: Parse LIVE operator scripts with PowerShell 7
        shell: pwsh
        run: |
          $files = @(
            '.\scripts\arm-phase7c-live-local.ps1',
            '.\scripts\configure-phase7c-mt5-terminal-profile-local.ps1',
            '.\scripts\disarm-phase7c-live-local.ps1',
            '.\scripts\get-phase7c-live-arm-local.ps1',
            '.\scripts\run-phase7c-account-bridge-task-runner-local.ps1',
            '.\packages\mt5-broker\bridge\run.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors -join '; ')" }
          }

      - name: Parse LIVE operator scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            '.\scripts\arm-phase7c-live-local.ps1',
            '.\scripts\configure-phase7c-mt5-terminal-profile-local.ps1',
            '.\scripts\disarm-phase7c-live-local.ps1',
            '.\scripts\get-phase7c-live-arm-local.ps1',
            '.\scripts\run-phase7c-account-bridge-task-runner-local.ps1',
            '.\packages\mt5-broker\bridge\run.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors -join '; ')" }
          }
