name: Apply Trend Entry Regime Attribution Patch

on:
  push:
    branches:
      - fix/trend-entry-regime-attribution
    paths:
      - '.github/workflows/apply-trend-entry-regime-attribution-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trend-entry-regime-attribution
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact production patch
        run: node scripts/apply-trend-entry-regime-attribution-patch.mjs
      - name: Verify Trend mode gate
        run: node --test scripts/phase7c-trend-mode-gate.test.mjs
      - name: Verify Trend regime attribution
        run: node --test scripts/phase7c-trend-entry-attribution.test.mjs
      - name: Parse modified modules
        run: |
          node --check scripts/phase7c-trend-mode-gate.mjs
          node --check scripts/phase7c-trend-entry-attribution.mjs
          node --check scripts/run-phase7c-trend-controller.mjs
          node --check scripts/phase7c-decision-audit.mjs
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7c-trend-controller.mjs scripts/phase7c-decision-audit.mjs
          git diff --cached --check
          git commit -m "fix: capture Trend final regime attribution"
          git push origin HEAD:fix/trend-entry-regime-attribution
