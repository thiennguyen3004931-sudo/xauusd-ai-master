name: Phase7C Reversal Entry Gate CI

on:
  push:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - 'apps/api/src/services/phase7c-decision-monitor.service.ts'
      - 'scripts/run-phase7c-trend-controller.mjs'
      - 'scripts/phase7c-decision-monitor.test.mjs'
      - '.github/workflows/phase7c-reversal-entry-gate-ci.yml'
  pull_request:
    paths:
      - 'apps/api/src/services/phase7c-decision-monitor.service.ts'
      - 'scripts/run-phase7c-trend-controller.mjs'
      - 'scripts/phase7c-decision-monitor.test.mjs'
      - '.github/workflows/phase7c-reversal-entry-gate-ci.yml'
  workflow_dispatch:

jobs:
  reversal-entry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Run Phase7C decision monitor regression tests
        run: pnpm --dir apps/api exec tsx ../../scripts/phase7c-decision-monitor.test.mjs
      - name: Parse Trend controller gate
        run: node --check scripts/run-phase7c-trend-controller.mjs
