      - "scripts/run-phase7c-trend-account-mode.mjs"
      - "scripts/run-phase7c-trend-controller-local.ps1"
      - "scripts/set-phase7c-account-risk-profile-local.ps1"
      - "scripts/smoke-phase7c-account-runtime-local.ps1"
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-activation-safety-source.ps1"
      - "scripts/test-phase7c-broker-time-normalization.py"
      - "scripts/test-phase7c-compact-mt5-dashboard-source.ps1"
      - "scripts/test-phase7c-mt5-panel-installer-source.ps1"
      - "scripts/test-phase7c-dual-account-mode-local.ps1"
      - "scripts/test-phase7c-dual-account-mode-source.ps1"
      - "scripts/test-phase7c-dual-account-mode.mjs"
      - "scripts/verify-phase7c-account-runtime-local.ps1"
      - ".github/workflows/phase7c-dual-account-mode-ci.yml"

permissions:
  contents: read

jobs:
  account-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate MJS syntax
        shell: pwsh
        run: |
          node --check .\scripts\phase7c-account-runtime-guard.mjs
          node --check .\scripts\phase7c-live-source-adapters.mjs
          node --check .\scripts\run-phase7c-trend-account-mode.mjs
          node --check .\scripts\run-phase7c-sideway-account-mode.mjs
          node --check .\scripts\run-phase7c-sideway-locked.mjs

      - name: Broker timestamp normalization regression
        shell: pwsh
        run: python .\scripts\test-phase7c-broker-time-normalization.py

      - name: Static source safety assertions
        shell: pwsh
        run: .\scripts\test-phase7c-dual-account-mode-source.ps1

      - name: Activation safety assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-activation-safety-source.ps1

      - name: Activation safety assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-activation-safety-source.ps1

      - name: Compact MT5 dashboard assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-compact-mt5-dashboard-source.ps1

      - name: Compact MT5 dashboard assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-compact-mt5-dashboard-source.ps1

      - name: MT5 panel installer assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-mt5-panel-installer-source.ps1

      - name: MT5 panel installer assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-mt5-panel-installer-source.ps1

      - name: Dual account tests with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-dual-account-mode-local.ps1

      - name: Dual account tests with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-dual-account-mode-local.ps1

  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dual account Node tests
        run: node scripts/test-phase7c-dual-account-mode.mjs

      - name: Build risk engine dependency graph
        run: pnpm --filter @xauusd/risk-engine... build

      - name: Build API
        run: pnpm --filter @xauusd/api... build
