      - "scripts/test-phase7c-compact-mt5-dashboard-source.ps1"
      - "scripts/test-phase7c-mt5-panel-installer-source.ps1"
      - "scripts/test-phase7c-dual-account-mode-local.ps1"
      - "scripts/test-phase7c-dual-account-mode-source.ps1"
      - "scripts/test-phase7c-dual-account-mode.mjs"
