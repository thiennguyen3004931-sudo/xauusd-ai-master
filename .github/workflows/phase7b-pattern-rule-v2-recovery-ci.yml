name: Phase7B Pattern Rule V2 Recovery CI

on:
  push:
    branches:
      - phase7c-sideway-supply-demand
    paths:
      - "scripts/repair-phase7b-pattern-v2-migration-parser.mjs"
      - ".github/workflows/phase7b-pattern-rule-v2-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase7c-sideway-supply-demand
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Repair migration parser
        run: |
          node --check scripts/repair-phase7b-pattern-v2-migration-parser.mjs
          node scripts/repair-phase7b-pattern-v2-migration-parser.mjs
          node --check scripts/apply-phase7b-pattern-rule-v2-local.mjs
          node --check scripts/finalize-phase7b-pattern-rule-v2-local.mjs

      - name: Apply Pattern Rule V2
        run: |
          node scripts/apply-phase7b-pattern-rule-v2-local.mjs --apply
          node scripts/finalize-phase7b-pattern-rule-v2-local.mjs

      - name: Verify canonical formulas and priority
        run: |
          grep -q 'bcBodyTotal < anchorBody' packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts
          grep -q 'bcdBodyTotal > anchorBody' packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts
          grep -q 'bBody < anchorBody' packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts
          grep -q 'bcBodyTotal > anchorBody' packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts
          grep -q 'Pattern Rule V2 priority: THREE -> TWO -> ENGULFING' packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts
          grep -q 'bcBodyTotal < anchorBody' scripts/run-phase7b-demo-controller.ts
          grep -q 'bcBodyTotal < anchorBody' apps/api/src/routes/phase7b-demo.route.ts
          ! grep -q '^} | null {' packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts
          ! grep -q '^} | null {' scripts/run-phase7b-demo-controller.ts
          ! grep -q '^} | null {' apps/api/src/routes/phase7b-demo.route.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test risk engine
        run: |
          pnpm --filter @xauusd/risk-engine... build
          pnpm --filter @xauusd/risk-engine typecheck
          pnpm --filter @xauusd/risk-engine test

      - name: Build API
        run: pnpm --filter @xauusd/api... build

      - name: Validate demo controller TypeScript transform
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const ts = require("typescript");
          const source = fs.readFileSync("scripts/run-phase7b-demo-controller.ts", "utf8");
          const transformed = ts.transpileModule(source, {
            fileName: "run-phase7b-demo-controller.ts",
            reportDiagnostics: true,
            compilerOptions: {
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ESNext,
              moduleResolution: ts.ModuleResolutionKind.Bundler,
              verbatimModuleSyntax: false,
            },
          });
          const errors = (transformed.diagnostics || []).filter(
            (diagnostic) => diagnostic.category === ts.DiagnosticCategory.Error,
          );
          if (errors.length) {
            for (const diagnostic of errors) console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, " "));
            process.exit(1);
          }
          NODE

      - name: Commit recovered Pattern Rule V2 source
        shell: bash
        run: |
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "PHASE7B_PATTERN_V2_COMMIT=NO_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply-phase7b-pattern-rule-v2-local.mjs \
            scripts/finalize-phase7b-pattern-rule-v2-local.mjs \
            packages/risk-engine/src/services/Phase7BDualPatternTrendRiderService.ts \
            packages/risk-engine/tests/Phase7BDualPatternTrendRiderService.test.ts \
            scripts/run-phase7b-demo-controller.ts \
            apps/api/src/routes/phase7b-demo.route.ts
          git commit -m "fix(phase7b): enforce canonical two and three candle Pattern Rule V2"
          git push origin HEAD:phase7c-sideway-supply-demand
          echo "PHASE7B_PATTERN_V2_COMMIT=PASS"
