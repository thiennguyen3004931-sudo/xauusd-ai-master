name: Phase7C LIVE Read-Only Probe CI

on:
  push:
    branches:
      - feat/phase7c-live-readonly-probe
    paths:
      - "scripts/probe-phase7c-live-readonly-local.ps1"
      - "scripts/test-phase7c-live-readonly-probe-source.ps1"
      - ".github/workflows/phase7c-live-readonly-probe-ci.yml"
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/probe-phase7c-live-readonly-local.ps1"
      - "scripts/test-phase7c-live-readonly-probe-source.ps1"
      - ".github/workflows/phase7c-live-readonly-probe-ci.yml"
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-readonly-probe-source.ps1

      - name: Source assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-readonly-probe-source.ps1

      - name: Parse operator probe with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\probe-phase7c-live-readonly-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }

      - name: Parse operator probe with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\probe-phase7c-live-readonly-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }
