name: Phase7C LIVE Capability Gate CI

on:
  push:
    branches:
      - feat/phase7c-live-capability-gate
    paths:
      - "scripts/enable-phase7c-live-capability-local.ps1"
      - "scripts/test-phase7c-live-capability-source.ps1"
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - ".github/workflows/phase7c-live-capability-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/enable-phase7c-live-capability-local.ps1"
      - "scripts/test-phase7c-live-capability-source.ps1"
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - ".github/workflows/phase7c-live-capability-ci.yml"

permissions:
  contents: read

jobs:
  live-capability-source:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-capability-source.ps1

      - name: Safety assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-capability-source.ps1

      - name: Parse helper with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\enable-phase7c-live-capability-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }

      - name: Parse helper with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\enable-phase7c-live-capability-local.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }
