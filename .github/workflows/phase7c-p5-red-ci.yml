name: Phase7C P5 RED Contract CI

on:
  pull_request:
    paths:
      - "scripts/test-phase7c-recommendation-intelligence-source.mjs"
      - "scripts/test-phase7c-recommendation-api-source.mjs"
      - "scripts/phase7c-recommendation-evaluator.test.ts"
      - ".github/workflows/phase7c-p5-red-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P5 source contract must be RED before implementation
        run: node scripts/test-phase7c-recommendation-intelligence-source.mjs

  api-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P5 GET-only API source contract must be RED before implementation
        run: node scripts/test-phase7c-recommendation-api-source.mjs

  evaluator-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: P5 evaluator semantics must be RED before implementation
        run: pnpm --filter @xauusd/api exec tsx ../../scripts/phase7c-recommendation-evaluator.test.ts
