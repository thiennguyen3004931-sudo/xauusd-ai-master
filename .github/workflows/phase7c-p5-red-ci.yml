name: Phase7C P5 RED Contract CI

on:
  pull_request:
    paths:
      - "scripts/test-phase7c-recommendation-intelligence-source.mjs"
      - "scripts/test-phase7c-recommendation-api-source.mjs"
      - "scripts/phase7c-recommendation-evaluator.test.ts"
      - "scripts/phase7c-recommendation-intelligence.test.ts"
      - "scripts/test-phase7c-p5-production-acceptance-source.ps1"
      - "apps/api/src/contracts/phase7c-recommendation-intelligence.schema.ts"
      - "apps/api/src/services/phase7c-recommendation-evaluator.service.ts"
      - ".github/workflows/phase7c-p5-red-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P5 source contract
        run: node scripts/test-phase7c-recommendation-intelligence-source.mjs

  api-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P5 GET-only API source contract
        run: node scripts/test-phase7c-recommendation-api-source.mjs

  evaluator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: P5 evaluator semantics
        run: pnpm --filter @xauusd/api exec tsx ../../scripts/phase7c-recommendation-evaluator.test.ts

  composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: P5 composition semantics
        run: pnpm --filter @xauusd/api exec tsx ../../scripts/phase7c-recommendation-intelligence.test.ts

  verifier-red:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P5 production acceptance source contract must be RED before verifier implementation
        shell: pwsh
        run: .\scripts\test-phase7c-p5-production-acceptance-source.ps1 -ProjectRoot $PWD
