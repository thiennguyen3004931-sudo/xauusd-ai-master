name: Phase7C Entry Truth Apply

on:
  push:
    branches:
      - fix/phase7c-telegram-entry-truth
    paths:
      - .github/workflows/phase7c-entry-truth-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/phase7c-telegram-entry-truth

      - name: Apply minimal notifier semantics fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/run-phase7b-telegram-notifier.mjs")
          text = path.read_text(encoding="utf-8")

          title_replacements = [
              (
                  "`DAILY RECOVERY ${side} SIGNAL · ${symbol}`",
                  "`🟡 DAILY RECOVERY ${side} PENDING · ${symbol} · CHƯA VÀO MT5`",
              ),
              (
                  "`${side} SIDEWAY SIGNAL · ${symbol}`",
                  "`🟡 ${side} SIDEWAY PENDING · ${symbol} · CHƯA VÀO MT5`",
              ),
              (
                  "`${side} SIGNAL · ${symbol}`",
                  "`🟡 ${side} PENDING · ${symbol} · CHƯA VÀO MT5`",
              ),
          ]

          for old, new in title_replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one notifier title match for {old!r}, got {count}")
              text = text.replace(old, new, 1)

          old_condition = '  if (\n    type === "ENTRY_REJECTED" ||\n    type === "ENTRY_ACCEPTED_POSITION_NOT_RESOLVED"\n  ) {'
          new_condition = '''  if (type === "ENTRY_REJECTED") {
            return warningCard(
              "⛔ ENTRY · KHÔNG VÀO MT5",
              event.reason ??
                event.message ??
                event.response?.reason ??
                event.response?.message ??
                event.response?.detail?.reason ??
                "ENTRY_REJECTED",
              event.response?.status ??
                event.status ??
                event.response?.retcode ??
                event.retcode,
            );
          }

          if (
            type === "ENTRY_ACCEPTED_POSITION_NOT_RESOLVED"
          ) {'''

          count = text.count(old_condition)
          if count != 1:
              raise SystemExit(f"expected exactly one ENTRY rejection condition, got {count}")
          text = text.replace(old_condition, new_condition, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify notifier regression locally in CI runner
        run: |
          node --check ./scripts/run-phase7b-telegram-notifier.mjs
          node --test ./scripts/phase7c-trade-notifier-synthetic.test.mjs

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/phase7c-entry-truth-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-telegram-notifier.mjs .github/workflows/phase7c-entry-truth-apply.yml
          git commit -m "fix: distinguish Telegram submit fill and reject"
          git push origin HEAD:fix/phase7c-telegram-entry-truth
