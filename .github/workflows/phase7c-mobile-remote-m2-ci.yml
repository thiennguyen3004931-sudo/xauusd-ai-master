name: Phase7C Mobile Remote M2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run-phase7c-mobile-readonly-gateway.mjs"
      - "scripts/start-phase7c-mobile-remote-tailscale-local.ps1"
      - "scripts/stop-phase7c-mobile-remote-tailscale-local.ps1"
      - "scripts/test-phase7c-mobile-remote-m2.mjs"
      - "scripts/test-phase7c-mobile-readonly-gateway-behavior.mjs"
      - ".github/workflows/phase7c-mobile-remote-m2-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mobile remote M2 source contract
        run: node scripts/test-phase7c-mobile-remote-m2.mjs

      - name: Mobile read-only gateway behavior
        run: node scripts/test-phase7c-mobile-readonly-gateway-behavior.mjs

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse M2 start and rollback scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            ".\\scripts\\start-phase7c-mobile-remote-tailscale-local.ps1",
            ".\\scripts\\stop-phase7c-mobile-remote-tailscale-local.ps1"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "M2 RED: required PowerShell file is missing: $path"
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failed for $path : $($errors | Out-String)"
            }
          }
