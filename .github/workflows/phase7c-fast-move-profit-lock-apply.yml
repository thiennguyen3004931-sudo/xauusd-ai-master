name: Phase7C Fast-Move Profit Lock Apply

on:
  push:
    branches:
      - feat/phase7c-fast-move-profit-lock
    paths:
      - .github/workflows/phase7c-fast-move-profit-lock-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    name: apply-verify-commit-controller-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase7c-fast-move-profit-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic controller patch
        run: node scripts/apply-phase7c-fast-move-profit-lock-ci.mjs
      - name: Fast-Move contract GREEN
        run: node --test scripts/phase7c-fast-move-profit-lock.test.mjs
      - name: Existing structural SL regression
        run: node --test scripts/test-phase7c-structural-sl-monotonicity.mjs
      - name: Parse modified JavaScript sources
        run: |
          node --check scripts/phase7c-fast-move-profit-lock.mjs
          node --check scripts/run-phase7c-sideway-controller.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified controller wiring
        shell: bash
        run: |
          if git diff --quiet -- scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs; then
            echo "CONTROLLER_PATCH_DIFF=NONE"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs
          git commit -m "feat(phase7c): wire fast-move profit lock"
          git push origin HEAD:feat/phase7c-fast-move-profit-lock
