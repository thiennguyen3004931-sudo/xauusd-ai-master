name: Phase7C Fast-Move Handoff Apply

on:
  push:
    branches:
      - feat/phase7c-fast-move-profit-lock
    paths:
      - .github/workflows/phase7c-fast-move-handoff-apply.yml

permissions:
  contents: write

jobs:
  apply-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase7c-fast-move-profit-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Trend structure handoff
        run: node scripts/apply-phase7c-fast-move-structure-handoff-ci.mjs
      - name: Fast-Move contract GREEN
        run: node --test scripts/phase7c-fast-move-profit-lock.test.mjs
      - name: Structural monotonicity regression
        run: node --test scripts/test-phase7c-structural-sl-monotonicity.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified Trend handoff
        shell: bash
        run: |
          if git diff --quiet -- scripts/run-phase7b-demo-controller.ts; then
            echo "TREND_HANDOFF_DIFF=NONE"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts
          git commit -m "fix(phase7c): hand off Fast-Move to Trend structure"
          git push origin HEAD:feat/phase7c-fast-move-profit-lock
