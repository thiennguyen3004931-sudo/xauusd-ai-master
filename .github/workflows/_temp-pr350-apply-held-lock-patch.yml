name: TEMP PR350 Apply Held-Lock Patch

on:
  push:
    branches:
      - fix/phase7c-running-ready-held-lock-generation-reload
    paths:
      - .github/workflows/_temp-pr350-apply-held-lock-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-running-ready-held-lock-generation-reload
          fetch-depth: 0
      - name: Apply exact bounded patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1'
          $source = (Get-Content -LiteralPath $path -Raw).Replace("`r`n", "`n").Replace("`r", "`n")
          $anchor = @'

  $preWebLifecycleStopped = `
'@
          $block = @'

  # A HELD singleton lock proves current singleton ownership, not that the broker
  # loaded the target source generation. When reload is already required, a proven
  # RUNNING+READY canonical broker/task tuple must be quiesced before strict Web/API
  # deploy. Unlike the released-lock repair above, the old broker launcher SHA is not
  # compared with the current runner file because definition-only task repair may have
  # happened after that broker started. The restarted broker is attested exactly below.
  $preWebRunningHeldLockCandidate = `
    [bool]$preWebLifecycle.running -and `
    [bool]$preWebLifecycle.ready -and `
    [string]$preWebLifecycle.mode.mode -eq 'PAUSE' -and `
    [string]$preWebLifecycle.accountMode.accountMode -eq 'LIVE' -and `
    [bool]$preWebLifecycle.accountMode.valid -and `
    [string]$preWebRuntimeGeneration.startupRunnerLockState -eq 'HELD'

  $preWebRunningHeldCanonicalProcessIds = @()
  $preWebRunningHeldInstanceCount = -1
  $preWebRunningHeldOwnership = $null
  $preWebRunningHeldDrift = @('UNREAD')
  $preWebRunningHeldLockQuiesceEligible = $false
  if ($preWebRunningHeldLockCandidate) {
    try {
      $preWebRunningHeldCanonicalProcessIds = @(Get-Phase7CCanonicalTaskProcessIds -Task $preWebTask)
      $preWebRunningHeldInstanceCount = Get-Phase7CRunningTaskInstanceCount -Name $TaskName
      $preWebRunningHeldOwnership = Test-Phase7CExecutorTaskActionOwnership `
        -Actions $preWebTask.Actions `
        -ExpectedRunnerPath $runnerPath `
        -ExpectedRunnerSha256 $trustedRunnerSha256
      $preWebRunningHeldDrift = @(Get-Phase7CExecutorTaskDrift -Task $preWebTask)
      $preWebRunningHeldLockQuiesceEligible = `
        [string]$preWebTask.State -eq 'Running' -and `
        [string]$preWebRuntimeGeneration.statusReadState -eq 'OK' -and `
        [string]$preWebRuntimeGeneration.heartbeatReadState -eq 'OK' -and `
        [bool]$preWebRuntimeGeneration.brokerStatusPidMatch -and `
        [bool]$preWebRuntimeGeneration.brokerProcessAlive -and `
        [bool]$preWebRuntimeGeneration.brokerHeartbeatFresh -and `
        $preWebRunningHeldCanonicalProcessIds.Count -eq 1 -and `
        $preWebRunningHeldInstanceCount -eq 1 -and `
        [int]$preWebRunningHeldCanonicalProcessIds[0] -eq [int]$preWebRuntimeGeneration.statusBrokerPid -and `
        [bool]$preWebRunningHeldOwnership.owned -and `
        [bool]$preWebRunningHeldOwnership.canonical -and `
        -not [bool]$preWebRunningHeldOwnership.repairRequired -and `
        $preWebRunningHeldDrift.Count -eq 0 -and `
        (Test-Phase7CSystemTaskPrincipal $preWebTask.Principal)
    } catch {
      $preWebRunningHeldLockQuiesceEligible = $false
    }
  }

  if ($preWebRunningHeldLockCandidate) {
    if (-not $preWebRunningHeldLockQuiesceEligible) {
      throw "RUNNING+READY lifecycle with HELD startup lock and stale source generation requires an exact canonical SYSTEM broker/task tuple before lifecycle quiesce. taskState=$($preWebTask.State) brokerAlive=$($preWebRuntimeGeneration.brokerProcessAlive) heartbeatFresh=$($preWebRuntimeGeneration.brokerHeartbeatFresh) lock=$($preWebRuntimeGeneration.startupRunnerLockState) canonicalProcesses=$($preWebRunningHeldCanonicalProcessIds.Count) taskInstances=$preWebRunningHeldInstanceCount"
    }

    Write-Host "PHASE7C_RUNTIME_READY_STABLE_RECOVERY_GENERATION_PRE_WEB_RUNNING_HELD_LOCK=ELIGIBLE_QUIESCE_REQUIRED"
    Assert-PauseDisarmed -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK"
    Assert-BridgeSession -ExpectedSession $bridgeSessionId -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK"
    Assert-FlatBroker -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK"

    # Re-prove the exact tuple immediately before the canonical lifecycle STOP.
    $preWebTask = Get-ScheduledTask -TaskName $TaskName -ErrorAction Stop
    $preWebRuntimeGeneration = Get-Phase7CRuntimeGenerationSnapshot -WorkDir $WorkDir
    $preWebLifecycle = Invoke-ApiGet "/api/v1/phase7c/lifecycle"
    $preWebRunningHeldCanonicalProcessIds = @(Get-Phase7CCanonicalTaskProcessIds -Task $preWebTask)
    $preWebRunningHeldInstanceCount = Get-Phase7CRunningTaskInstanceCount -Name $TaskName
    $preWebRunningHeldOwnership = Test-Phase7CExecutorTaskActionOwnership `
      -Actions $preWebTask.Actions `
      -ExpectedRunnerPath $runnerPath `
      -ExpectedRunnerSha256 $trustedRunnerSha256
    $preWebRunningHeldDrift = @(Get-Phase7CExecutorTaskDrift -Task $preWebTask)
    $preWebRunningHeldLockStillEligible = `
      [bool]$preWebLifecycle.running -and `
      [bool]$preWebLifecycle.ready -and `
      [string]$preWebLifecycle.mode.mode -eq 'PAUSE' -and `
      [string]$preWebLifecycle.accountMode.accountMode -eq 'LIVE' -and `
      [bool]$preWebLifecycle.accountMode.valid -and `
      [string]$preWebTask.State -eq 'Running' -and `
      [string]$preWebRuntimeGeneration.statusReadState -eq 'OK' -and `
      [string]$preWebRuntimeGeneration.heartbeatReadState -eq 'OK' -and `
      [bool]$preWebRuntimeGeneration.brokerStatusPidMatch -and `
      [bool]$preWebRuntimeGeneration.brokerProcessAlive -and `
      [bool]$preWebRuntimeGeneration.brokerHeartbeatFresh -and `
      [string]$preWebRuntimeGeneration.startupRunnerLockState -eq 'HELD' -and `
      $preWebRunningHeldCanonicalProcessIds.Count -eq 1 -and `
      $preWebRunningHeldInstanceCount -eq 1 -and `
      [int]$preWebRunningHeldCanonicalProcessIds[0] -eq [int]$preWebRuntimeGeneration.statusBrokerPid -and `
      [bool]$preWebRunningHeldOwnership.owned -and `
      [bool]$preWebRunningHeldOwnership.canonical -and `
      -not [bool]$preWebRunningHeldOwnership.repairRequired -and `
      $preWebRunningHeldDrift.Count -eq 0 -and `
      (Test-Phase7CSystemTaskPrincipal $preWebTask.Principal)
    if (-not $preWebRunningHeldLockStillEligible) {
      throw "RUNNING+READY HELD-lock canonical broker/task tuple changed during safety recheck; lifecycle stop blocked."
    }

    Assert-PauseDisarmed -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK"
    Assert-BridgeSession -ExpectedSession $bridgeSessionId -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK"
    Assert-FlatBroker -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK"
    [void](Invoke-ApiPost "/api/v1/phase7c/lifecycle/stop" @{})
    Wait-LifecycleStopped
    Assert-LifecycleExecutorsStopped -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK_POST_STOP"
    Assert-PauseDisarmed -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK_POST_STOP"
    Assert-BridgeSession -ExpectedSession $bridgeSessionId -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK_POST_STOP"
    Assert-FlatBroker -Stage "GENERATION_PRE_WEB_RUNNING_HELD_LOCK_POST_STOP"
    Write-Host "PHASE7C_RUNTIME_READY_STABLE_RECOVERY_GENERATION_PRE_WEB_RUNNING_HELD_LOCK_LIFECYCLE_STOP=PASS"

    # The existing stopped-lifecycle path below independently proves the canonical
    # task, stops the old broker, requires a new PID, exact target attestation, HELD
    # singleton ownership, and stable READY before Web/API deploy.
    $preWebRuntimeGeneration = Get-Phase7CRuntimeGenerationSnapshot -WorkDir $WorkDir
    $preWebLifecycle = Invoke-ApiGet "/api/v1/phase7c/lifecycle"
    $preWebTask = Get-ScheduledTask -TaskName $TaskName -ErrorAction Stop
  }
'@
          $count = ([regex]::Matches($source, [regex]::Escape($anchor))).Count
          if ($count -ne 1) { throw "Expected exactly one insertion anchor; found $count" }
          $updated = $source.Replace($anchor, $block + $anchor)
          [System.IO.File]::WriteAllText((Join-Path $PWD $path), $updated, [System.Text.UTF8Encoding]::new($false))

          $after = (Get-Content -LiteralPath $path -Raw).Replace("`r`n", "`n").Replace("`r", "`n")
          if (-not $after.Contains('PHASE7C_RUNTIME_READY_STABLE_RECOVERY_GENERATION_PRE_WEB_RUNNING_HELD_LOCK=ELIGIBLE_QUIESCE_REQUIRED')) { throw 'Held-lock marker missing after patch.' }
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw "PowerShell syntax error: $($errors[0].Message)" }
      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1
          git diff --cached --exit-code && throw 'Expected source patch was not produced.'
          git commit -m "fix: quiesce running stale held-lock generation before web deploy"
          git push origin HEAD:fix/phase7c-running-ready-held-lock-generation-reload
