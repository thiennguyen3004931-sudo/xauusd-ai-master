name: Phase7C Lifecycle Caller Provenance CI

on:
  push:
    branches:
      - feat/phase7c-lifecycle-caller-provenance
    paths:
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "apps/web/src/api.ts"
      - "scripts/test-phase7c-lifecycle-caller-provenance.mjs"
      - ".github/workflows/phase7c-lifecycle-caller-provenance-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "apps/web/src/api.ts"
      - "scripts/test-phase7c-lifecycle-caller-provenance.mjs"
      - ".github/workflows/phase7c-lifecycle-caller-provenance-ci.yml"

permissions:
  contents: read

jobs:
  provenance-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Lifecycle caller provenance regression
        run: node scripts/test-phase7c-lifecycle-caller-provenance.mjs

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: Build Web
        run: pnpm --filter @xauusd/web build
