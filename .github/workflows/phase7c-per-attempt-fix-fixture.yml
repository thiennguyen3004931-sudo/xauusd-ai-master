name: Phase7C Per-Attempt Fix Fixture Contract

on:
  push:
    branches:
      - fix/phase7c-per-attempt-lifecycle-logs
    paths:
      - ".github/workflows/phase7c-per-attempt-fix-fixture.yml"

permissions:
  contents: write

jobs:
  fix-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase7c-per-attempt-lifecycle-logs
          fetch-depth: 0
      - name: Update stub supervisor interface only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-phase7c-startup-runner-lock-broker-stop-failure-local.ps1')
          text = path.read_text(encoding='utf-8')
          old = "  [Parameter(Mandatory = $true)] [string]$TelegramEnvFile,\n  [Parameter(Mandatory = $true)] [string]$AccountMode,"
          new = "  [Parameter(Mandatory = $true)] [string]$TelegramEnvFile,\n  [string]$AttemptLogDir = '',\n  [Parameter(Mandatory = $true)] [string]$AccountMode,"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stub param match, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Commit fixture compatibility fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/phase7c-per-attempt-fix-fixture.yml
          git add scripts/test-phase7c-startup-runner-lock-broker-stop-failure-local.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(phase7c): accept attempt log dir in supervisor fixture"
          git push origin HEAD:fix/phase7c-per-attempt-lifecycle-logs
