name: Phase7C LIVE Risk Profile CI

on:
  push:
    branches:
      - feat/phase7c-live-risk-profile-guard
    paths:
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - "scripts/configure-phase7c-live-risk-local.ps1"
      - "scripts/get-phase7c-live-risk-local.ps1"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-live-risk-profile-source.ps1"
      - ".github/workflows/phase7c-live-risk-profile-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "PHASE7C-DUAL-ACCOUNT-MODE.md"
      - "scripts/configure-phase7c-live-risk-local.ps1"
      - "scripts/get-phase7c-live-risk-local.ps1"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-live-risk-profile-source.ps1"
      - ".github/workflows/phase7c-live-risk-profile-ci.yml"

permissions:
  contents: read

jobs:
  live-risk-source-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: LIVE risk fail-closed assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-risk-profile-source.ps1

      - name: LIVE risk fail-closed assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-risk-profile-source.ps1

      - name: Parse changed PowerShell with PowerShell 7
        shell: pwsh
        run: |
          $files = @(
            '.\scripts\configure-phase7c-live-risk-local.ps1',
            '.\scripts\get-phase7c-live-risk-local.ps1',
            '.\scripts\lib\phase7c-account-mode.ps1',
            '.\scripts\switch-phase7c-account-mode-local.ps1',
            '.\scripts\test-phase7c-live-risk-profile-source.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors -join '; ')" }
          }

      - name: Parse changed PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            '.\scripts\configure-phase7c-live-risk-local.ps1',
            '.\scripts\get-phase7c-live-risk-local.ps1',
            '.\scripts\lib\phase7c-account-mode.ps1',
            '.\scripts\switch-phase7c-account-mode-local.ps1',
            '.\scripts\test-phase7c-live-risk-profile-source.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors -join '; ')" }
          }