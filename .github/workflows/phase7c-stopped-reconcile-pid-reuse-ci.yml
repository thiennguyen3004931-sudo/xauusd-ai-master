name: Phase7C Stopped Reconcile PID Reuse CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/reconcile-phase7c-stopped-lifecycle-broker-provenance-local.ps1"
      - "scripts/test-phase7c-stopped-reconcile-pid-reuse-source.ps1"
      - ".github/workflows/phase7c-stopped-reconcile-pid-reuse-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/reconcile-phase7c-stopped-lifecycle-broker-provenance-local.ps1"
      - "scripts/test-phase7c-stopped-reconcile-pid-reuse-source.ps1"
      - ".github/workflows/phase7c-stopped-reconcile-pid-reuse-ci.yml"

permissions:
  contents: read

jobs:
  pid-reuse-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PID reuse contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-stopped-reconcile-pid-reuse-source.ps1
      - name: PID reuse contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-stopped-reconcile-pid-reuse-source.ps1
