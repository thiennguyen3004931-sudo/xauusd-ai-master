name: Phase7C Performance Intelligence CI

on:
  pull_request:
    paths:
      - "apps/api/src/services/phase7c-performance-intelligence.service.ts"
      - "apps/api/src/routes/phase7c-performance-intelligence.route.ts"
      - "apps/api/src/app.ts"
      - "scripts/test-phase7c-performance-intelligence-source.mjs"
      - ".github/workflows/phase7c-performance-intelligence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Performance Intelligence source contract
        run: node scripts/test-phase7c-performance-intelligence-source.mjs

      - name: Build API
        run: pnpm --filter @xauusd/api build
