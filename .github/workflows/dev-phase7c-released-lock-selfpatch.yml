name: DEV Phase7C Released Lock Recovery Self Patch

on:
  push:
    branches:
      - fix/phase7c-stopped-lifecycle-released-lock-recovery
    paths:
      - ".github/workflows/dev-phase7c-released-lock-selfpatch.yml"
      - "scripts/dev-patch-phase7c-released-lock-recovery.ps1"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase7c-stopped-lifecycle-released-lock-recovery
          fetch-depth: 0

      - name: Apply bounded production patch
        shell: pwsh
        run: .\scripts\dev-patch-phase7c-released-lock-recovery.ps1

      - name: GREEN contract PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-stopped-lifecycle-preweb-generation-source.ps1

      - name: GREEN contract Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-stopped-lifecycle-preweb-generation-source.ps1

      - name: Fail-closed recovery safety regression
        shell: pwsh
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1

      - name: Lifecycle broker safety regression
        shell: pwsh
        run: |
          .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
          .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1

      - name: Diff hygiene
        shell: bash
        run: git diff --check

      - name: Commit verified production patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1
          if (git diff --cached --quiet) {
            throw "Expected verified recovery production diff is empty."
          }
          git commit -m "fix: recover stopped lifecycle released broker lock"
          git push origin HEAD:fix/phase7c-stopped-lifecycle-released-lock-recovery
