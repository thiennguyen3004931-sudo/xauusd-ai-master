name: Phase7C Runtime Source Generation Reconciliation CI

on:
  push:
    branches:
      - fix/phase7c-runtime-source-generation-reconciliation
      - fix/phase7c-generation-reconciliation-failclosed-resume
      - fix/phase7c-resume-reuse-exact-broker
    paths:
      - 'scripts/reconcile-phase7c-runtime-source-generation-local.ps1'
      - 'scripts/resume-phase7c-runtime-source-generation-reconciliation-local.ps1'
      - 'scripts/continue-phase7c-runtime-source-generation-reconciliation-exact-broker-local.ps1'
      - 'scripts/test-phase7c-runtime-source-generation-reconciliation-source.ps1'
      - '.github/workflows/phase7c-runtime-source-generation-reconciliation-ci.yml'
  pull_request:
    paths:
      - 'scripts/reconcile-phase7c-runtime-source-generation-local.ps1'
      - 'scripts/resume-phase7c-runtime-source-generation-reconciliation-local.ps1'
      - 'scripts/continue-phase7c-runtime-source-generation-reconciliation-exact-broker-local.ps1'
      - 'scripts/test-phase7c-runtime-source-generation-reconciliation-source.ps1'
      - '.github/workflows/phase7c-runtime-source-generation-reconciliation-ci.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime generation reconciliation contract - PowerShell 7
        shell: pwsh
        run: ./scripts/test-phase7c-runtime-source-generation-reconciliation-source.ps1

      - name: Runtime generation reconciliation contract - Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-phase7c-runtime-source-generation-reconciliation-source.ps1

      - name: Parse helper - PowerShell 7
        shell: pwsh
        run: |
          $files = @(
            './scripts/reconcile-phase7c-runtime-source-generation-local.ps1',
            './scripts/resume-phase7c-runtime-source-generation-reconciliation-local.ps1',
            './scripts/continue-phase7c-runtime-source-generation-reconciliation-exact-broker-local.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Parse helper - Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            './scripts/reconcile-phase7c-runtime-source-generation-local.ps1',
            './scripts/resume-phase7c-runtime-source-generation-reconciliation-local.ps1',
            './scripts/continue-phase7c-runtime-source-generation-reconciliation-exact-broker-local.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
