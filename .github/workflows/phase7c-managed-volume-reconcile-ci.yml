name: Phase7C Managed Volume Safe Reconcile CI

on:
  pull_request:
    paths:
      - 'scripts/phase7c-managed-volume-reconcile.mjs'
      - 'scripts/phase7c-managed-volume-reconcile.test.mjs'
      - 'scripts/phase7c-live-source-adapters.mjs'
      - 'scripts/run-phase7b-demo-controller.ts'
      - 'scripts/run-phase7c-sideway-controller.mjs'
      - '.github/workflows/phase7c-managed-volume-reconcile-ci.yml'
  push:
    paths:
      - 'scripts/phase7c-managed-volume-reconcile.mjs'
      - 'scripts/phase7c-managed-volume-reconcile.test.mjs'
      - 'scripts/phase7c-live-source-adapters.mjs'
      - 'scripts/run-phase7b-demo-controller.ts'
      - 'scripts/run-phase7c-sideway-controller.mjs'
      - '.github/workflows/phase7c-managed-volume-reconcile-ci.yml'

permissions:
  contents: read

jobs:
  managed-volume-safe-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run managed-volume reconciliation contract
        run: node --test scripts/phase7c-managed-volume-reconcile.test.mjs
