name: Phase7C Lot Range 1.20 CI

on:
  push:
    branches:
      - fix/phase7c-account-risk-lot-max-120
    paths:
      - "apps/web/src/pages/Phase7BOpsPage.tsx"
      - "scripts/phase7c-lot-range-120.test.mjs"
      - ".github/workflows/phase7c-lot-range-120-ci.yml"
  pull_request:
    paths:
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/api/src/services/phase7c-lot-settings.service.ts"
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "apps/web/src/pages/Phase7BOpsPage.tsx"
      - "scripts/lib/phase7c-account-mode.ps1"
      - "scripts/activate-phase7c-local.ps1"
      - "scripts/run-phase7b-demo-controller.ts"
      - "scripts/run-phase7c-executors-local.ps1"
      - "scripts/run-phase7c-sideway-controller-local.ps1"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - "scripts/run-phase7c-trend-controller-local.ps1"
      - "scripts/phase7c-lot-range-120.test.mjs"
      - ".github/workflows/phase7c-lot-range-120-ci.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: Test 0.03 to 1.20 lot contract
        run: node --test scripts/phase7c-lot-range-120.test.mjs

      - name: Build Web
        run: pnpm --filter @xauusd/web... build
