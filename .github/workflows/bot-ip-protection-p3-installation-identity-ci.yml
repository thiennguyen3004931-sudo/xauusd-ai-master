name: BOT IP Protection P3 Installation Identity CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/installation-identity/**"
      - ".github/workflows/bot-ip-protection-p3-installation-identity-ci.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  installation-identity-task2-red:
    name: installation-identity-task2-red
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies for Task 2 RED
        run: pnpm install --no-frozen-lockfile
      - name: Build copy protocol dependency
        run: pnpm --filter @xauusd/copy-protocol build
      - name: Installation identity full suite RED
        run: pnpm --filter @xauusd/installation-identity test
