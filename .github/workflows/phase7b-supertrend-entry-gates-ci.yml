name: Phase7B Supertrend Entry Gates CI

on:
  push:
    branches:
      - phase7c-sideway-supply-demand
    paths:
      - "scripts/apply-phase7b-supertrend-entry-gates-local.mjs"
      - "scripts/apply-phase7b-supertrend-entry-gates-v2-local.mjs"
      - "scripts/apply-phase7b-canonical-entry-v3-local.mjs"
      - ".github/workflows/phase7b-supertrend-entry-gates-ci.yml"
  pull_request:
    paths:
      - "scripts/apply-phase7b-supertrend-entry-gates-local.mjs"
      - "scripts/apply-phase7b-supertrend-entry-gates-v2-local.mjs"
      - "scripts/apply-phase7b-canonical-entry-v3-local.mjs"
      - ".github/workflows/phase7b-supertrend-entry-gates-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply three-candle prerequisite
        run: |
          node scripts/apply-phase7b-three-candle-pattern-local.mjs --apply
          grep -q 'THREE_CANDLE_BODY_DOMINANCE' scripts/run-phase7b-demo-controller.ts

      - name: Apply broker clock prerequisite
        run: |
          node scripts/apply-phase7c-broker-clock-fix-local.mjs --apply
          grep -q 'const now = Number(quote.timestamp)' scripts/run-phase7b-demo-controller.ts

      - name: Apply UI clock prerequisite
        run: |
          node scripts/apply-phase7b-pattern-ui-clock-local.mjs --apply
          grep -q 'inferBrokerClockOffset' apps/api/src/routes/phase7b-demo.route.ts

      - name: Check canonical V3 without mutation
        run: |
          node --check scripts/apply-phase7b-canonical-entry-v3-local.mjs
          node scripts/apply-phase7b-canonical-entry-v3-local.mjs | tee /tmp/canonical-v3-check.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_CHECK=PASS' /tmp/canonical-v3-check.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_ORIGINAL_MUTATION=False' /tmp/canonical-v3-check.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_MA20_MA50=CONFIDENCE_ONLY_NOT_ENTRY_GATE' /tmp/canonical-v3-check.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_MA200=TREND_MANAGEMENT_HOLD_EXIT_NOT_ENTRY_GATE' /tmp/canonical-v3-check.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_REAL_ACCOUNT_ALLOWED=False' /tmp/canonical-v3-check.log

      - name: Apply canonical V3 in CI checkout
        run: |
          node scripts/apply-phase7b-canonical-entry-v3-local.mjs --apply | tee /tmp/canonical-v3-apply.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_APPLY=PASS' /tmp/canonical-v3-apply.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_VALIDATION=PASS' /tmp/canonical-v3-apply.log
          grep -q 'PHASE7B_CANONICAL_ENTRY_V3_DEMO_ONLY=True' /tmp/canonical-v3-apply.log

      - name: Build risk-engine dependency graph
        run: pnpm --filter @xauusd/risk-engine... build

      - name: Test Supertrend service and risk engine
        run: |
          pnpm --filter @xauusd/risk-engine typecheck
          pnpm --filter @xauusd/risk-engine test

      - name: Build API
        run: pnpm --filter @xauusd/api... build

      - name: Build Web
        run: pnpm --filter @xauusd/web... build

      - name: Validate Trend controller TypeScript transform
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const ts = require("typescript");
          const source = fs.readFileSync("scripts/run-phase7b-demo-controller.ts", "utf8");
          const transformed = ts.transpileModule(source, {
            fileName: "run-phase7b-demo-controller.ts",
            reportDiagnostics: true,
            compilerOptions: {
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ESNext,
              moduleResolution: ts.ModuleResolutionKind.Bundler,
              verbatimModuleSyntax: false,
            },
          });
          const errors = (transformed.diagnostics || []).filter(
            (diagnostic) => diagnostic.category === ts.DiagnosticCategory.Error,
          );
          if (errors.length) {
            for (const diagnostic of errors) {
              console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, " "));
            }
            process.exit(1);
          }
          fs.writeFileSync(".phase7b-supertrend-gates-ci.mjs", transformed.outputText, "utf8");
          NODE
          node --check .phase7b-supertrend-gates-ci.mjs
          rm -f .phase7b-supertrend-gates-ci.mjs

      - name: Verify canonical entry and MA roles
        run: |
          grep -q 'phase7BSupertrend' scripts/run-phase7b-demo-controller.ts
          grep -q 'PHASE7B_DEMO_ENTRY_GATE=PATTERN_PLUS_SUPERTREND_M15_M5_PLUS_VALID_STRUCTURE' scripts/run-phase7b-demo-controller.ts
          grep -q 'PHASE7B_DEMO_MA20_MA50=CONFIDENCE_ONLY_NOT_ENTRY_GATE' scripts/run-phase7b-demo-controller.ts
          grep -q 'PHASE7B_DEMO_MA200=TREND_MANAGEMENT_HOLD_EXIT_NOT_ENTRY_GATE' scripts/run-phase7b-demo-controller.ts
          ! grep -q 'trendMatches(trigger.side, current.close, ma20, ma50, ma200)' scripts/run-phase7b-demo-controller.ts
          grep -q 'while (m5SignalIndex >= 0 && m5\[m5SignalIndex\]!.closeTime > current.closeTime)' scripts/run-phase7b-demo-controller.ts
          grep -q 'm15Direction !== trigger.side || m5Direction !== trigger.side' scripts/run-phase7b-demo-controller.ts
          grep -q 'await closeAll(position, "TREND_MA200", latest.closeTime)' scripts/run-phase7b-demo-controller.ts
          ! grep -q 'await closeAll(position, "TREND_MA20", latest.closeTime)' scripts/run-phase7b-demo-controller.ts
          grep -q 'const eligible = Boolean(pattern && supertrendAligned && validStructure);' apps/api/src/routes/phase7b-demo.route.ts
          grep -q 'const buyAligned = ma20 > ma50 && current.close > ma20;' apps/api/src/routes/phase7b-demo.route.ts
          grep -q 'const sellAligned = ma20 < ma50 && current.close < ma20;' apps/api/src/routes/phase7b-demo.route.ts
          grep -q 'while (m5SignalIndex >= 0 && m5Bars\[m5SignalIndex\]!.closeTime > current.closeTime)' apps/api/src/routes/phase7b-demo.route.ts
          grep -q 'rule: "PATTERN_PLUS_SUPERTREND_M15_M5_PLUS_VALID_STRUCTURE"' apps/api/src/routes/phase7b-demo.route.ts
          grep -q 'MA20/50 chỉ tăng độ tin cậy; MA200 dùng giữ/chốt trend' apps/web/src/ui/DashboardLayout.tsx
          grep -q 'MA20/50 chỉ xác nhận độ tin cậy, không chặn entry' apps/web/src/pages/Phase7BPatternCheckPage.tsx
          grep -q 'MA200 xác nhận xu hướng để giữ runner hoặc chốt' apps/web/src/pages/Phase7BPatternCheckPage.tsx
          grep -q 'THREE_CANDLE_BODY_DOMINANCE' scripts/run-phase7b-demo-controller.ts
          grep -q 'inferBrokerClockOffset' apps/api/src/routes/phase7b-demo.route.ts
          grep -q 'const now = Number(quote.timestamp)' scripts/run-phase7b-demo-controller.ts
