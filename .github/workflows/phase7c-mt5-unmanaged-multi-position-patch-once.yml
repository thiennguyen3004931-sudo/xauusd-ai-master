name: Phase7C MT5 Unmanaged Multi Position Patch Once

on:
  push:
    branches:
      - fix/phase7c-mt5-unmanaged-multi-position-status
    paths:
      - .github/workflows/phase7c-mt5-unmanaged-multi-position-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-mt5-unmanaged-multi-position-status
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact minimal observability patch
        shell: python
        run: |
          from pathlib import Path

          ui = Path('apps/api/src/services/phase7c-ui-contract.service.ts')
          text = ui.read_text(encoding='utf-8')
          replacements = [
              (
                  '  position: null | {\n    state: string;\n    strategy: string | null;',
                  '  position: null | {\n    state: string;\n    count: number;\n    strategy: string | null;',
              ),
              (
                  '  const position = state === "MANAGING" ? {\n    state: snapshot.position.state,\n    strategy: snapshot.position.strategy,',
                  '  const position = state === "MANAGING" ? {\n    state: snapshot.position.state,\n    count: snapshot.position.count,\n    strategy: snapshot.position.strategy,',
              ),
              (
                  '    ["positionState", position?.state],\n    ["positionStrategy", position?.strategy],',
                  '    ["positionState", position?.state],\n    ["positionCount", position?.count],\n    ["positionStrategy", position?.strategy],',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'UI_PATCH_TARGET_NOT_UNIQUE count={text.count(old)} target={old!r}')
              text = text.replace(old, new, 1)
          ui.write_text(text, encoding='utf-8')

          panel = Path('mt5/XAUUSD_AI_Master_Decision_Panel.mq5')
          text = panel.read_text(encoding='utf-8')
          old = '''   const int x = 10;\n   const int w = width - 20;\n   Card(x, 316, w, 64, C'8,26,20', C'45,130,70');\n   int top_y = CenteredTextY(322, 24, SECTION_FONT_SIZE);\n   int bottom_y = CenteredTextY(348, 24, BODY_FONT_SIZE);\n   Text(x + 18, top_y, "ĐANG GIỮ LỆNH", clrLimeGreen, SECTION_FONT_SIZE);'''
          new = '''   const int x = 10;\n   const int w = width - 20;\n   string position_state = Clean(Field(payload, "positionState"), "UNMANAGED");\n   string position_count = Clean(Field(payload, "positionCount"), "?");\n   bool position_unmanaged = position_state == "UNMANAGED";\n   color position_tone = position_unmanaged ? clrTomato : clrLimeGreen;\n   string position_title = position_unmanaged\n      ? "CẢNH BÁO: " + position_count + " VỊ THẾ CHƯA ĐƯỢC QUẢN LÝ"\n      : "ĐANG GIỮ LỆNH";\n   Card(x, 316, w, 64, position_unmanaged ? C'35,18,18' : C'8,26,20', position_tone);\n   int top_y = CenteredTextY(322, 24, SECTION_FONT_SIZE);\n   int bottom_y = CenteredTextY(348, 24, BODY_FONT_SIZE);\n   Text(x + 18, top_y, FitText(position_title, w / 2 - 30, SECTION_FONT_SIZE), position_tone, SECTION_FONT_SIZE);'''
          if text.count(old) != 1:
              raise SystemExit(f'PANEL_PATCH_TARGET_NOT_UNIQUE count={text.count(old)}')
          panel.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase7c-mt5-unmanaged-multi-position-patch-once.yml
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/phase7c-ui-contract.service.ts mt5/XAUUSD_AI_Master_Decision_Panel.mq5 .github/workflows/phase7c-mt5-unmanaged-multi-position-patch-once.yml
          git commit -m "fix(phase7c): warn MT5 on unmanaged multiple positions"
          git push origin HEAD:fix/phase7c-mt5-unmanaged-multi-position-status
