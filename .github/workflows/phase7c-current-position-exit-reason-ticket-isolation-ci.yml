name: Phase7C Current Position Exit Reason Ticket Isolation CI

on:
  push:
    branches:
      - fix/phase7c-current-position-exit-reason-ticket-isolation
    paths:
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "scripts/phase7c-current-position-exit-reason-ticket-isolation.test.mjs"
      - ".github/workflows/phase7c-current-position-exit-reason-ticket-isolation-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "scripts/phase7c-current-position-exit-reason-ticket-isolation.test.mjs"
      - ".github/workflows/phase7c-current-position-exit-reason-ticket-isolation-ci.yml"

permissions:
  contents: read

jobs:
  current-position-exit-reason-ticket-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Current position exit-reason ticket isolation contract
        run: node --import ./apps/api/node_modules/tsx/dist/loader.mjs --test scripts/phase7c-current-position-exit-reason-ticket-isolation.test.mjs
