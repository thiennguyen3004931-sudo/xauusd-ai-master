name: Phase7C Canonical Realized Notifier Patch

on:
  push:
    branches:
      - codex/phase7c-canonical-deal-ledger-accounting
    paths:
      - .github/workflows/phase7c-notifier-canonical-realized-patch.yml

permissions:
  contents: write

jobs:
  patch-notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase7c-canonical-deal-ledger-accounting
          fetch-depth: 0

      - name: Apply deterministic source-only patch
        run: node scripts/apply-phase7c-canonical-realized-notifier-patch.mjs

      - name: Verify and commit
        shell: bash
        run: |
          git config user.name "phase7c-source-only-bot"
          git config user.email "phase7c-source-only-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(phase7c): use canonical realized deals in notifier"
          git push origin HEAD:codex/phase7c-canonical-deal-ledger-accounting
