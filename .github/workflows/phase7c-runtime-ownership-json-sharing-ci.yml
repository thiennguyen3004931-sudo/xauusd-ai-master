name: Phase7C Runtime Ownership JSON Sharing CI

on:
  push:
    branches:
      - fix/phase7c-runtime-ownership-json-sharing
    paths:
      - "scripts/lib/phase7c-runtime-ownership-probe.ps1"
      - "scripts/lib/phase7c-startup-runner-guard.ps1"
      - "scripts/test-phase7c-runtime-ownership-json-sharing.ps1"
      - ".github/workflows/phase7c-runtime-ownership-json-sharing-ci.yml"
  pull_request:
    paths:
      - "scripts/lib/phase7c-runtime-ownership-probe.ps1"
      - "scripts/lib/phase7c-startup-runner-guard.ps1"
      - "scripts/test-phase7c-runtime-ownership-json-sharing.ps1"
      - ".github/workflows/phase7c-runtime-ownership-json-sharing-ci.yml"

permissions:
  contents: read

jobs:
  runtime-ownership-json-sharing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime ownership JSON sharing regression - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-runtime-ownership-json-sharing.ps1
      - name: Runtime ownership JSON sharing regression - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-runtime-ownership-json-sharing.ps1
