name: Phase7C Canonical Deal Ledger Accounting CI

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase7c-canonical-deal-ledger-accounting
      - codex/phase7c-canonical-ledger-startup-backfill-e2e
    paths:
      - "packages/mt5-broker/src/accounting/**"
      - "packages/mt5-broker/src/index.ts"
      - "apps/api/src/index.ts"
      - "apps/api/src/services/phase7c-canonical-deal-ledger.service.ts"
      - "apps/api/src/services/phase7c-canonical-deal-ledger.startup.test.ts"
      - "apps/api/src/services/phase7c-daily-recovery-view.service.ts"
      - "apps/api/src/services/mt5-performance.service.ts"
      - "scripts/run-phase7b-telegram-notifier.mjs"
      - "scripts/phase7c-trade-notifier-synthetic.test.mjs"
      - "scripts/test-phase7c-canonical-deal-ledger-consumers-contract.mjs"
      - "scripts/test-phase7c-canonical-ledger-startup-backfill-contract.mjs"
      - "scripts/test-phase7c-hold-m15-dedupe-contract.mjs"
      - "scripts/test-phase7c-hold-telegram-dedupe-contract.mjs"
      - "scripts/test-phase7c-hold-journal-canonical-contract.mjs"
      - "scripts/test-phase7c-structural-sl-monotonicity.mjs"
      - "scripts/phase7c-stop-monotonicity.mjs"
      - "scripts/phase7c-sideway-logic.mjs"
      - "scripts/run-phase7b-demo-controller.ts"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - ".github/workflows/phase7c-canonical-deal-ledger-accounting-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/mt5-broker/src/accounting/**"
      - "packages/mt5-broker/src/index.ts"
      - "apps/api/src/index.ts"
      - "apps/api/src/services/phase7c-canonical-deal-ledger.service.ts"
      - "apps/api/src/services/phase7c-canonical-deal-ledger.startup.test.ts"
      - "apps/api/src/services/phase7c-daily-recovery-view.service.ts"
      - "apps/api/src/services/mt5-performance.service.ts"
      - "scripts/run-phase7b-telegram-notifier.mjs"
      - "scripts/phase7c-trade-notifier-synthetic.test.mjs"
      - "scripts/test-phase7c-canonical-deal-ledger-consumers-contract.mjs"
      - "scripts/test-phase7c-canonical-ledger-startup-backfill-contract.mjs"
      - "scripts/test-phase7c-hold-m15-dedupe-contract.mjs"
      - "scripts/test-phase7c-hold-telegram-dedupe-contract.mjs"
      - "scripts/test-phase7c-hold-journal-canonical-contract.mjs"
      - "scripts/test-phase7c-structural-sl-monotonicity.mjs"
      - "scripts/phase7c-stop-monotonicity.mjs"
      - "scripts/phase7c-sideway-logic.mjs"
      - "scripts/run-phase7b-demo-controller.ts"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - ".github/workflows/phase7c-canonical-deal-ledger-accounting-ci.yml"

permissions:
  contents: read

jobs:
  canonical-ledger-full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonical ledger startup source contract
        run: node --test scripts/test-phase7c-canonical-ledger-startup-backfill-contract.mjs

      - name: Canonical ledger startup historical restart behavior
        run: pnpm --filter @xauusd/api exec tsx src/services/phase7c-canonical-deal-ledger.startup.test.ts

      - name: Canonical durable deal ledger contract
        run: pnpm --filter @xauusd/mt5-broker exec vitest run src/accounting/canonical-deal-ledger.test.ts

      - name: Existing broker-day accounting regression
        run: pnpm --filter @xauusd/mt5-broker exec vitest run src/accounting/broker-day-realized-pnl.test.ts

      - name: Canonical consumer migration contract
        run: node --test scripts/test-phase7c-canonical-deal-ledger-consumers-contract.mjs

      - name: Trade notifier PARTIAL and EXIT synthetic regression
        run: node --test scripts/phase7c-trade-notifier-synthetic.test.mjs

      - name: HOLD M15 canonical regressions
        run: |
          node --test scripts/test-phase7c-hold-m15-dedupe-contract.mjs
          node --test scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
          node --test scripts/test-phase7c-hold-journal-canonical-contract.mjs

      - name: Structural SL and Sideway exact one-third regression
        run: node --test scripts/test-phase7c-structural-sl-monotonicity.mjs

      - name: Phase7C Sideway execution regressions
        run: |
          node --test scripts/phase7c-sideway-logic.test.mjs
          node --test scripts/phase7c-sideway-execution-guards.test.mjs
          node --test scripts/phase7c-execution-lock.test.mjs
          node --test scripts/phase7c-forward-report.test.mjs

      - name: Build and test broker risk and strategy dependency graphs
        run: |
          pnpm --filter @xauusd/mt5-broker... build
          pnpm --filter @xauusd/mt5-broker typecheck
          pnpm --filter @xauusd/risk-engine... build
          pnpm --filter @xauusd/risk-engine typecheck
          pnpm --filter @xauusd/risk-engine test
          pnpm --filter @xauusd/strategy-engine... build
          pnpm --filter @xauusd/strategy-engine typecheck
          pnpm --filter @xauusd/strategy-engine test

      - name: Build API and Web dependency graphs
        run: |
          pnpm --filter @xauusd/api... build
          pnpm --filter @xauusd/web... build

      - name: Diff hygiene
        run: git diff --check
