name: Apply Phase7C Current Position Exit Reason Ticket Isolation Patch

on:
  push:
    branches:
      - fix/phase7c-current-position-exit-reason-ticket-isolation
    paths:
      - ".github/workflows/_apply-phase7c-current-position-exit-reason-ticket-isolation.yml"

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-current-position-exit-reason-ticket-isolation
          fetch-depth: 0
      - name: Apply exact exit-reason ticket transform
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/services/phase7c-ui-contract.service.ts")
          text = path.read_text(encoding="utf-8")
          old = '''function exitReasons(snapshot: Snapshot): string[] {\n  const reasons: string[] = [];\n  for (const row of snapshot.recentDecisions) {\n    const event = String(row.event ?? "");\n'''
          new = '''function exitReasons(snapshot: Snapshot): string[] {\n  const reasons: string[] = [];\n  const ticket = String(snapshot.position.ticket ?? "");\n  for (const row of snapshot.recentDecisions) {\n    if (ticket && String(row.management?.ticket ?? "") !== ticket) continue;\n    const event = String(row.event ?? "");\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exact exitReasons block once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_apply-phase7c-current-position-exit-reason-ticket-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/phase7c-ui-contract.service.ts .github/workflows/_apply-phase7c-current-position-exit-reason-ticket-isolation.yml
          git commit -m "fix(phase7c): isolate current exit reasons by ticket"
          git push origin HEAD:fix/phase7c-current-position-exit-reason-ticket-isolation
