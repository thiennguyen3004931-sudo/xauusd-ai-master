name: Phase7C Multiple Position Monitor Patch Once

on:
  push:
    branches:
      - fix/phase7c-multiple-position-monitor-fail-closed
    paths:
      - .github/workflows/phase7c-multiple-position-monitor-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact fail-closed patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/api/src/services/phase7c-decision-monitor.service.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  const states = input.managedStates ?? { TREND: null, SIDEWAY: null };
          const ticket = String(position.ticket);
          const trendManaged = String(states.TREND?.ticket ?? "") === ticket ? states.TREND : null;
          const sidewayManaged = String(states.SIDEWAY?.ticket ?? "") === ticket ? states.SIDEWAY : null;
          const strategy: Strategy | null = trendManaged ? "TREND" : sidewayManaged ? "SIDEWAY" : null;
          const managed = trendManaged ?? sidewayManaged;
          const ticketAudit = input.audit.filter((row) => String(row.management?.ticket ?? "") === ticket);
          '''
          new = '''  const states = input.managedStates ?? { TREND: null, SIDEWAY: null };
          const ticket = String(position.ticket);
          const hasExactlyOnePosition = positions.length === 1;
          const trendManaged = hasExactlyOnePosition && String(states.TREND?.ticket ?? "") === ticket ? states.TREND : null;
          const sidewayManaged = hasExactlyOnePosition && String(states.SIDEWAY?.ticket ?? "") === ticket ? states.SIDEWAY : null;
          const strategy: Strategy | null = trendManaged ? "TREND" : sidewayManaged ? "SIDEWAY" : null;
          const managed = trendManaged ?? sidewayManaged;
          const ticketAudit = hasExactlyOnePosition
            ? input.audit.filter((row) => String(row.management?.ticket ?? "") === ticket)
            : [];
          '''
          if old not in text:
              raise SystemExit('PATCH_TARGET_NOT_FOUND')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-shot workflow
        run: rm .github/workflows/phase7c-multiple-position-monitor-patch-once.yml

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/phase7c-decision-monitor.service.ts .github/workflows/phase7c-multiple-position-monitor-patch-once.yml
          git commit -m "fix(phase7c): fail closed on multiple monitored positions"
          git push origin HEAD:fix/phase7c-multiple-position-monitor-fail-closed
