name: Windows Phase7C Startup Runner Lock

on:
  push:
    branches:
      - main
      - fix/phase7c-startup-runner-lock-lifetime
    paths:
      - 'scripts/lib/phase7c-startup-runner-guard.ps1'
      - 'scripts/lib/phase7c-runtime-ownership-probe.ps1'
      - 'scripts/lib/phase7c-scheduled-task-ownership.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-lifetime-local.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-persistent-loop-local.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-system-task-local.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-broker-stop-failure-local.ps1'
      - 'scripts/test-phase7c-runtime-ownership-generation-mismatch-local.ps1'
      - '.github/workflows/windows-phase7c-startup-runner-lock.yml'
  pull_request:
    paths:
      - 'scripts/lib/phase7c-startup-runner-guard.ps1'
      - 'scripts/lib/phase7c-runtime-ownership-probe.ps1'
      - 'scripts/lib/phase7c-scheduled-task-ownership.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-lifetime-local.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-persistent-loop-local.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-system-task-local.ps1'
      - 'scripts/test-phase7c-startup-runner-lock-broker-stop-failure-local.ps1'
      - 'scripts/test-phase7c-runtime-ownership-generation-mismatch-local.ps1'
      - '.github/workflows/windows-phase7c-startup-runner-lock.yml'

jobs:
  lock-lifetime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Startup runner lock finite lifetime - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-lock-lifetime-local.ps1
      - name: Startup runner lock persistent loop - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-lock-persistent-loop-local.ps1
      - name: Startup runner lock persistent SYSTEM task - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-lock-system-task-local.ps1
      - name: Startup runner exact broker STOP failure - SYSTEM Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-lock-broker-stop-failure-local.ps1
      - name: Runtime ownership generation mismatch - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-runtime-ownership-generation-mismatch-local.ps1
      - name: Startup runner lock finite lifetime - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-lock-lifetime-local.ps1
      - name: Startup runner lock persistent loop - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-lock-persistent-loop-local.ps1
      - name: Runtime ownership generation mismatch - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-runtime-ownership-generation-mismatch-local.ps1
