name: Phase7C Daily Recovery Preview Actual Lot CI

on:
  push:
    branches:
      - fix/phase7c-daily-recovery-preview-actual-lot
    paths:
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - "scripts/test-phase7c-daily-recovery-preview-actual-lot-source.mjs"
      - ".github/workflows/phase7c-daily-recovery-preview-actual-lot-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - "scripts/test-phase7c-daily-recovery-preview-actual-lot-source.mjs"
      - ".github/workflows/phase7c-daily-recovery-preview-actual-lot-ci.yml"

permissions:
  contents: read

jobs:
  daily-recovery-preview-actual-lot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web dependency graph
        run: pnpm --filter @xauusd/web... build
      - name: Daily Recovery preview actual-lot source contract
        run: node scripts/test-phase7c-daily-recovery-preview-actual-lot-source.mjs
