name: Phase7C SEMI Auto Trend Management CI

on:
  push:
    branches:
      - feat/semi-auto-trend-management-20260909
    paths:
      - "packages/strategy-engine/src/models/BotMode.ts"
      - "packages/execution-engine/src/**"
      - "apps/api/src/services/phase7c-bot-mode.service.ts"
      - "apps/api/src/services/phase7c-bot-mode.semi.test.ts"
      - "apps/api/src/services/phase7c-semi-*.ts"
      - "apps/api/src/services/trend-management-*.ts"
      - "apps/api/src/services/sqlite-management-state.repository.ts"
      - "apps/api/src/services/controlled-management-executor.service.ts"
      - "apps/api/src/services/phase7c-strategy-entry-conditions.service.ts"
      - "apps/api/src/services/phase7c-decision-monitor.service.ts"
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "apps/web/src/**"
      - "scripts/phase7c-semi-entry-boundary-decision.test.mjs"
      - "scripts/apply-phase7c-semi-task6-green.mjs"
      - "scripts/run-phase7c-trend-controller.mjs"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - ".github/workflows/phase7c-semi-auto-trend-management-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/strategy-engine/src/models/BotMode.ts"
      - "packages/execution-engine/src/**"
      - "apps/api/src/services/phase7c-bot-mode.service.ts"
      - "apps/api/src/services/phase7c-bot-mode.semi.test.ts"
      - "apps/api/src/services/phase7c-semi-*.ts"
      - "apps/api/src/services/trend-management-*.ts"
      - "apps/api/src/services/sqlite-management-state.repository.ts"
      - "apps/api/src/services/controlled-management-executor.service.ts"
      - "apps/api/src/services/phase7c-strategy-entry-conditions.service.ts"
      - "apps/api/src/services/phase7c-decision-monitor.service.ts"
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "apps/web/src/**"
      - "scripts/phase7c-semi-entry-boundary-decision.test.mjs"
      - "scripts/apply-phase7c-semi-task6-green.mjs"
      - "scripts/run-phase7c-trend-controller.mjs"
      - "scripts/run-phase7c-sideway-controller.mjs"
      - ".github/workflows/phase7c-semi-auto-trend-management-ci.yml"

permissions:
  contents: write

jobs:
  semi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded Task6 GREEN patch on feature push
        if: github.event_name == 'push'
        run: |
          if grep -q 'function semiManualOnlyDecision' apps/api/src/services/phase7c-decision-monitor.service.ts; then
            echo 'PHASE7C_SEMI_TASK6_PATCH=ALREADY_APPLIED'
          else
            node scripts/apply-phase7c-semi-task6-green.mjs
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: SEMI bot-mode contract
        run: pnpm --filter @xauusd/api exec tsx src/services/phase7c-bot-mode.semi.test.ts

      - name: SEMI manual adoption contract
        run: pnpm --filter @xauusd/api exec tsx src/services/phase7c-semi-manual-adoption.test.ts

      - name: SEMI durable adoption ledger contract
        run: pnpm --filter @xauusd/api exec tsx src/services/phase7c-semi-adoption-state.test.ts

      - name: SEMI broker protection executor contract
        run: pnpm --filter @xauusd/api exec tsx src/services/phase7c-semi-protection-executor.test.ts

      - name: SEMI Trend management-only plan contract
        run: pnpm --filter @xauusd/api exec tsx src/services/phase7c-semi-trend-management-plan.test.ts

      - name: Build API and dependencies for runtime integration test
        run: pnpm build --filter=@xauusd/api...

      - name: SEMI entry boundary and decision semantics
        run: pnpm --filter @xauusd/api exec tsx --test ../../scripts/phase7c-semi-entry-boundary-decision.test.mjs

      - name: SEMI Trend runtime ownership handoff contract
        run: pnpm --filter @xauusd/api exec tsx src/services/trend-management-runtime.semi.test.ts

      - name: SEMI management-only execution-engine typecheck
        run: pnpm --filter @xauusd/execution-engine typecheck

      - name: Build Web and dependencies
        run: pnpm build --filter=@xauusd/web...

      - name: Commit verified Task6 GREEN patch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- apps/api/src/services/phase7c-decision-monitor.service.ts apps/api/src/services/phase7c-ui-contract.service.ts scripts/run-phase7c-trend-controller.mjs scripts/run-phase7c-sideway-controller.mjs; then
            echo 'PHASE7C_SEMI_TASK6_COMMIT=NO_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/services/phase7c-decision-monitor.service.ts apps/api/src/services/phase7c-ui-contract.service.ts scripts/run-phase7c-trend-controller.mjs scripts/run-phase7c-sideway-controller.mjs
          git commit -m 'feat(phase7c): enforce SEMI manual entry boundary'
          git push origin HEAD:${GITHUB_REF_NAME}
