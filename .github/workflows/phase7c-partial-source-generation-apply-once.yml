name: Phase7C Partial Source Generation Apply Once

on:
  push:
    branches:
      - fix/phase7c-partial-source-generation-reconciliation
    paths:
      - '.github/workflows/phase7c-partial-source-generation-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded integration patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/.tmp-apply-phase7c-partial-source-generation-patch.ps1
          if ($LASTEXITCODE -ne 0) { throw "Guarded recovery patcher failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1
          git commit -m 'fix: reconcile partial source generation before web deploy'
          git push origin HEAD:fix/phase7c-partial-source-generation-reconciliation
