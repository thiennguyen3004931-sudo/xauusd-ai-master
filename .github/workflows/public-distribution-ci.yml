name: Public Distribution CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-distribution:
    name: public-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Distribution artifact boundary tests
        run: node --test scripts/security/check-distribution-artifact.test.mjs
