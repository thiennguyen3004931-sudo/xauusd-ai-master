name: Phase7C Structural SL Monotonicity CI
# Synthetic/source-only regression: no runtime, ARM, mode, bridge, or order mutation.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/phase7c-structural-sl-monotonicity
    paths:
      - scripts/test-phase7c-structural-sl-monotonicity.mjs
      - scripts/phase7c-stop-monotonicity.mjs
      - scripts/phase7c-sideway-logic.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - .github/workflows/phase7c-structural-sl-monotonicity-ci.yml
  pull_request:
    paths:
      - scripts/test-phase7c-structural-sl-monotonicity.mjs
      - scripts/phase7c-stop-monotonicity.mjs
      - scripts/phase7c-sideway-logic.mjs
      - scripts/run-phase7b-demo-controller.ts
      - scripts/run-phase7c-sideway-controller.mjs
      - .github/workflows/phase7c-structural-sl-monotonicity-ci.yml

permissions:
  contents: read

jobs:
  contract:
    name: structural-sl-monotonicity-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Structural SL monotonicity contract
        run: node --test ./scripts/test-phase7c-structural-sl-monotonicity.mjs

      - name: Source syntax checks
        run: |
          node --check ./scripts/phase7c-stop-monotonicity.mjs
          node --check ./scripts/phase7c-sideway-logic.mjs
          node --check ./scripts/run-phase7c-sideway-controller.mjs

      - name: Diff hygiene
        run: git diff --check

  full-ci:
    name: full-repository-ci
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration validation
        run: pnpm check:integration

      - name: Diff hygiene
        run: git diff --check
