name: TEMP Phase7C Orphan Rollout Resume Self Patch

on:
  push:
    branches:
      - fix/phase7c-production-rollout-orphan-queued-resume
    paths:
      - ".github/workflows/temp-phase7c-orphan-rollout-resume-selfpatch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-production-rollout-orphan-queued-resume
          fetch-depth: 0

      - name: Apply ORPHAN_QUEUED rollout resume patch
        shell: pwsh
        run: python .github/phase7c-orphan-rollout-resume-patch.py

      - name: Verify parser and source contract with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/rollout-phase7c-production-source-transition-local.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw $errors[0].Message }
          .\scripts\test-phase7c-production-source-transition-rollout-source.ps1

      - name: Verify source contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-production-source-transition-rollout-source.ps1

      - name: Commit production helper only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rollout-phase7c-production-source-transition-local.ps1
          git diff --cached --check
          git diff --cached --quiet && { echo "NO_PRODUCTION_PATCH"; exit 1; } || true
          git commit -m "fix(phase7c): resume rollout from orphan queued runtime"
          git push origin HEAD:fix/phase7c-production-rollout-orphan-queued-resume
