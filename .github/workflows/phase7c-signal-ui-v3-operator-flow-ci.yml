name: Phase7C Signal UI V3 Operator Flow CI

on:
  push:
    branches:
      - feat/signal-ui-v3-operator-flow
    paths:
      - "apps/web/src/pages/Phase7BPatternCheckPage.tsx"
      - "apps/web/src/phase7c-panel-status.ts"
      - "scripts/test-phase7c-signal-ui-v3-operator-flow.mjs"
      - ".github/workflows/phase7c-signal-ui-v3-operator-flow-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/src/pages/Phase7BPatternCheckPage.tsx"
      - "apps/web/src/phase7c-panel-status.ts"
      - "scripts/test-phase7c-signal-ui-v3-operator-flow.mjs"
      - ".github/workflows/phase7c-signal-ui-v3-operator-flow-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Signal UI V3 operator-flow source contract
        run: node scripts/test-phase7c-signal-ui-v3-operator-flow.mjs

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter @xauusd/web build
