name: Phase7C Web MT5 Sync DEMO E2E CI

on:
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "mt5/XAUUSD_AI_Master_Decision_Panel.mq5"
      - "scripts/install-phase7c-mt5-decision-panel-local.ps1"
      - "scripts/install-phase7c-mt5-decision-panel-both-accounts-local.ps1"
      - "scripts/deploy-phase7c-web-mt5-sync-local.ps1"
      - "scripts/run-phase7c-demo-e2e-local.ps1"
      - "scripts/test-phase7c-web-mt5-sync-source.mjs"
      - "apps/api/src/services/phase7c-ui-contract.service.ts"
      - "apps/web/src/pages/Phase7BDemoPage.tsx"
      - ".github/workflows/phase7c-web-mt5-sync-demo-e2e-ci.yml"

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Web MT5 semantic sync source assertions
        run: node scripts/test-phase7c-web-mt5-sync-source.mjs

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: Build Web dependency graph
        run: pnpm --filter @xauusd/web... build

  powershell-parse:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse orchestration scripts - PowerShell 7
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content .\scripts\install-phase7c-mt5-decision-panel-local.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\scripts\install-phase7c-mt5-decision-panel-both-accounts-local.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\scripts\deploy-phase7c-web-mt5-sync-local.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\scripts\run-phase7c-demo-e2e-local.ps1 -Raw))
          Write-Host "PHASE7C_WEB_MT5_SYNC_PWSH_PARSE=PASS"

      - name: Parse orchestration scripts - Windows PowerShell 5.1
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content .\scripts\install-phase7c-mt5-decision-panel-local.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\scripts\install-phase7c-mt5-decision-panel-both-accounts-local.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\scripts\deploy-phase7c-web-mt5-sync-local.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\scripts\run-phase7c-demo-e2e-local.ps1 -Raw))
          Write-Host "PHASE7C_WEB_MT5_SYNC_WINPS_PARSE=PASS"
