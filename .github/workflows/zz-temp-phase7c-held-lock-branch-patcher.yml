name: TEMP Phase7C Held Lock Branch Patcher

on:
  push:
    branches:
      - fix/phase7c-running-ready-held-generation-preweb-reload

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase7c-running-ready-held-generation-preweb-reload
          fetch-depth: 0
      - name: Apply deterministic source patch
        shell: pwsh
        run: .\scripts\tmp-apply-phase7c-running-held-lock-preweb-patch.ps1
      - name: Verify source syntax and new regression locally
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('.\scripts\recover-phase7c-runtime-ready-stable-deploy-local.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw $errors[0].Message }
          .\scripts\test-phase7c-running-ready-held-lock-preweb-generation-source.ps1
      - name: Commit only durable fix
        shell: pwsh
        run: |
          git rm .github/workflows/zz-temp-phase7c-held-lock-branch-patcher.yml
          git rm scripts/tmp-apply-phase7c-running-held-lock-preweb-patch.ps1
          git add scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reload running stale generation before web deploy"
          git push origin HEAD:fix/phase7c-running-ready-held-generation-preweb-reload