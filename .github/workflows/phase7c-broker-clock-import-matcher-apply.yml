name: Phase7C Broker-Clock Import Matcher Apply
# One-shot source compatibility fix only. No runtime, ARM, mode, bridge, or order mutation.

on:
  push:
    branches:
      - feat/phase7c-broker-day-accounting
    paths:
      - "scripts/apply-phase7c-broker-clock-import-matcher-fix.mjs"
      - ".github/workflows/phase7c-broker-clock-import-matcher-apply.yml"

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase7c-broker-day-accounting
          fetch-depth: 0
      - name: Apply matcher fix
        run: node scripts/apply-phase7c-broker-clock-import-matcher-fix.mjs
      - name: Syntax check broker-clock applicator
        run: node --check scripts/apply-phase7c-broker-clock-fix-local.mjs
      - name: Verify check-only broker-clock applicator against canonical controllers
        run: node scripts/apply-phase7c-broker-clock-fix-local.mjs
      - name: Verify corrected matcher is bounded to one import block
        shell: bash
        run: |
          grep -Fq 'const pattern = /import\s*\{([^}]*)\}\s*from' scripts/apply-phase7c-broker-clock-fix-local.mjs
          ! grep -Fq 'const pattern = /import\s*\{([\s\S]*?)\}\s*from' scripts/apply-phase7c-broker-clock-fix-local.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove one-shot scaffolding
        run: |
          git rm scripts/apply-phase7c-broker-clock-import-matcher-fix.mjs
          git rm .github/workflows/phase7c-broker-clock-import-matcher-apply.yml
      - name: Commit verified matcher fix
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(phase7c): bound broker-clock import matcher"
          git push origin HEAD:feat/phase7c-broker-day-accounting
