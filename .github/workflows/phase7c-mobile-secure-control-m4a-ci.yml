name: Phase7C Mobile Secure Control M4-A CI

on:
  push:
    branches:
      - feature/m4a-mobile-secure-control
    paths:
      - "apps/mobile-gateway/**"
      - "apps/web/src/mobile-m4-control.ts"
      - "apps/web/src/mobile-m4-control.test.ts"
      - "apps/web/src/pages/Phase7CMobileReadOnlyPage.tsx"
      - "scripts/test-phase7c-mobile-m4a-source-contract.mjs"
      - ".github/workflows/phase7c-mobile-secure-control-m4a-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile-gateway/**"
      - "apps/web/src/mobile-m4-control.ts"
      - "apps/web/src/mobile-m4-control.test.ts"
      - "apps/web/src/pages/Phase7CMobileReadOnlyPage.tsx"
      - "scripts/test-phase7c-mobile-m4a-source-contract.mjs"
      - ".github/workflows/phase7c-mobile-secure-control-m4a-ci.yml"

permissions:
  contents: read

jobs:
  gateway-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gateway tests
        working-directory: apps/mobile-gateway
        run: npm test

      - name: Gateway syntax
        working-directory: apps/mobile-gateway
        run: npm run build
