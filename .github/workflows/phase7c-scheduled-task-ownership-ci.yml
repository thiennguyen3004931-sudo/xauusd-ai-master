name: Phase7C Scheduled Task Ownership CI

on:
  push:
    branches:
      - fix/phase7c-scheduled-task-ownership
    paths:
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/verify-phase7c-executors-local.ps1"
      - "scripts/test-phase7c-scheduled-task-ownership-local.ps1"
      - "PHASE7C-SCHEDULED-TASK-OWNERSHIP.md"
      - ".github/workflows/phase7c-scheduled-task-ownership-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/verify-phase7c-executors-local.ps1"
      - "scripts/test-phase7c-scheduled-task-ownership-local.ps1"
      - "PHASE7C-SCHEDULED-TASK-OWNERSHIP.md"
      - ".github/workflows/phase7c-scheduled-task-ownership-ci.yml"

permissions:
  contents: read

jobs:
  ownership-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-scheduled-task-ownership-local.ps1

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-scheduled-task-ownership-local.ps1
