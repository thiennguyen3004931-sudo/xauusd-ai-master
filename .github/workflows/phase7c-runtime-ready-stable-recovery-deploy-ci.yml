name: Phase7C Runtime Ready Stable Recovery Deploy CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1"
      - "scripts/test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1"
      - "scripts/test-phase7c-recovery-migration-verifier-window-source.ps1"
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/deploy-phase7c-mt5-dashboard-local.ps1"
      - "scripts/verify-phase7c-account-runtime-local.ps1"
      - "scripts/lib/phase7c-runtime-ownership-probe.ps1"
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - ".github/workflows/phase7c-runtime-ready-stable-recovery-deploy-ci.yml"
  push:
    branches:
      - fix/phase7c-recovery-migration-verifier-window
    paths:
      - "scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1"
      - "scripts/test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1"
      - "scripts/test-phase7c-recovery-migration-verifier-window-source.ps1"
      - "scripts/dev-apply-phase7c-recovery-migration-verifier-window.ps1"
      - "scripts/dev-harden-phase7c-recovery-migration-verifier-window.ps1"
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/deploy-phase7c-mt5-dashboard-local.ps1"
      - "scripts/verify-phase7c-account-runtime-local.ps1"
      - "scripts/lib/phase7c-runtime-ownership-probe.ps1"
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - ".github/workflows/phase7c-runtime-ready-stable-recovery-deploy-ci.yml"

permissions:
  contents: write

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply bounded migration verifier patch in checkout
        shell: pwsh
        run: .\scripts\dev-apply-phase7c-recovery-migration-verifier-window.ps1
      - name: Harden migration verifier trusted Git binding in checkout
        shell: pwsh
        run: .\scripts\dev-harden-phase7c-recovery-migration-verifier-window.ps1
      - name: Stable-ready recovery deploy contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1
      - name: Stable-ready recovery deploy contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1
      - name: Recovery migration verifier window RED/GREEN contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-recovery-migration-verifier-window-source.ps1
      - name: Recovery migration verifier window RED/GREEN contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-recovery-migration-verifier-window-source.ps1
      - name: Commit verified bounded production patch
        if: success() && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1 `
            scripts/deploy-phase7c-web-ui-local.ps1 `
            scripts/deploy-phase7c-mt5-dashboard-local.ps1 `
            scripts/verify-phase7c-account-runtime-local.ps1 `
            scripts/test-phase7c-recovery-migration-verifier-window-source.ps1
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: bind recovery migration verifier to trusted Git runner"
            git push origin "HEAD:${{ github.ref_name }}"
          } else {
            Write-Host "PHASE7C_DEV_PATCH_COMMIT=SKIPPED_NO_DIFF"
          }

  safety-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply bounded migration verifier patch in checkout
        shell: pwsh
        run: .\scripts\dev-apply-phase7c-recovery-migration-verifier-window.ps1
      - name: Harden migration verifier trusted Git binding in checkout
        shell: pwsh
        run: .\scripts\dev-harden-phase7c-recovery-migration-verifier-window.ps1
      - name: Canonical Web/API safe deploy contract
        shell: pwsh
        run: .\scripts\test-phase7c-web-ui-safe-deploy-source.ps1
      - name: Lifecycle broker source contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Lifecycle broker protocol safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1
      - name: LIVE ARM source safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-live-arm-source.ps1
      - name: Existing fail-closed runtime recovery contract
        shell: pwsh
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1
