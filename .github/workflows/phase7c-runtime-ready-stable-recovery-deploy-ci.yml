name: Phase7C Runtime Ready Stable Recovery Deploy CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1"
      - "scripts/test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1"
      - "scripts/test-phase7c-recovery-migration-verifier-window-source.ps1"
      - "scripts/test-phase7c-lifecycle-broker-battery-task-source.ps1"
      - "scripts/test-phase7c-battery-settings-recovery-migration-source.ps1"
      - "scripts/test-phase7c-battery-stopped-lifecycle-preweb-repair-source.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/deploy-phase7c-mt5-dashboard-local.ps1"
      - "scripts/verify-phase7c-account-runtime-local.ps1"
      - "scripts/lib/phase7c-runtime-ownership-probe.ps1"
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - ".github/workflows/phase7c-runtime-ready-stable-recovery-deploy-ci.yml"
  push:
    branches:
      - main
      - fix/phase7c-battery-stopped-lifecycle-preweb-repair
    paths:
      - "scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1"
      - "scripts/test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1"
      - "scripts/test-phase7c-recovery-migration-verifier-window-source.ps1"
      - "scripts/test-phase7c-lifecycle-broker-battery-task-source.ps1"
      - "scripts/test-phase7c-battery-settings-recovery-migration-source.ps1"
      - "scripts/test-phase7c-battery-stopped-lifecycle-preweb-repair-source.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/deploy-phase7c-mt5-dashboard-local.ps1"
      - "scripts/verify-phase7c-account-runtime-local.ps1"
      - "scripts/lib/phase7c-runtime-ownership-probe.ps1"
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - ".github/workflows/phase7c-runtime-ready-stable-recovery-deploy-ci.yml"
      - "dev-apply-phase7c-battery-stopped-lifecycle-preweb-repair.ps1"

permissions:
  contents: write

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply exact bounded development patch
        if: github.event_name == 'push' && github.ref_name == 'fix/phase7c-battery-stopped-lifecycle-preweb-repair'
        shell: pwsh
        run: .\dev-apply-phase7c-battery-stopped-lifecycle-preweb-repair.ps1
      - name: Stable-ready recovery deploy contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1
      - name: Stable-ready recovery deploy contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-runtime-ready-stable-recovery-deploy-source.ps1
      - name: Recovery migration verifier window contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-recovery-migration-verifier-window-source.ps1
      - name: Recovery migration verifier window contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-recovery-migration-verifier-window-source.ps1
      - name: Lifecycle broker battery task contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-lifecycle-broker-battery-task-source.ps1
      - name: Lifecycle broker battery task contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-lifecycle-broker-battery-task-source.ps1
      - name: Battery settings recovery migration contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-battery-settings-recovery-migration-source.ps1
      - name: Battery settings recovery migration contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-battery-settings-recovery-migration-source.ps1
      - name: Battery stopped-lifecycle pre-Web repair contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-battery-stopped-lifecycle-preweb-repair-source.ps1
      - name: Battery stopped-lifecycle pre-Web repair contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-battery-stopped-lifecycle-preweb-repair-source.ps1
      - name: Commit exact bounded development patch
        if: github.event_name == 'push' && github.ref_name == 'fix/phase7c-battery-stopped-lifecycle-preweb-repair'
        shell: pwsh
        run: |
          git diff --exit-code -- scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'DEV_PATCH_COMMIT=SKIPPED_ALREADY_COMMITTED'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/recover-phase7c-runtime-ready-stable-deploy-local.ps1
          git commit -m 'fix: repair battery task before stopped-lifecycle web deploy'
          git push origin HEAD:fix/phase7c-battery-stopped-lifecycle-preweb-repair

  safety-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Canonical Web/API safe deploy contract
        shell: pwsh
        run: .\scripts\test-phase7c-web-ui-safe-deploy-source.ps1
      - name: Lifecycle broker source contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Lifecycle broker protocol safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1
      - name: LIVE ARM source safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-live-arm-source.ps1
      - name: Existing fail-closed runtime recovery contract
        shell: pwsh
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1
