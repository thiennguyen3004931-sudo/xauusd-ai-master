name: Phase7C Lot Range 1.20 Apply

on:
  push:
    branches:
      - feat/phase7c-lot-range-120
    paths:
      - "scripts/apply-phase7c-lot-range-120-v2.mjs"
      - ".github/workflows/phase7c-lot-range-120-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase7c-lot-range-120
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded source patch
        run: node scripts/apply-phase7c-lot-range-120-v2.mjs

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: Verify new and existing lot regressions
        run: |
          node --test scripts/phase7c-lot-range-120.test.mjs
          node --test scripts/phase7c-lot-settings.test.mjs

      - name: Build Web
        run: pnpm --filter @xauusd/web... build

      - name: Verify no runtime mutation files were changed
        shell: bash
        run: |
          git diff --exit-code -- .runtime || true
          git status --short
          test -z "$(git status --short | grep -E '^.. \.runtime/' || true)"

      - name: Commit GREEN production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/routes/phase7c.route.ts \
            apps/api/src/services/phase7c-lot-settings.service.ts \
            apps/web/src/pages/Phase7CControlCenterPage.tsx \
            scripts/lib/phase7c-account-mode.ps1 \
            scripts/activate-phase7c-local.ps1 \
            scripts/phase7c-lot-settings.test.mjs \
            scripts/run-phase7b-demo-controller.ts \
            scripts/run-phase7c-executors-local.ps1 \
            scripts/run-phase7c-sideway-controller-local.ps1 \
            scripts/run-phase7c-sideway-controller.mjs \
            scripts/run-phase7c-trend-controller-local.ps1
          git diff --cached --quiet && { echo "No production changes staged"; exit 1; }
          git commit -m "feat(phase7c): expand adjustable lot range to 1.20"
          git push origin HEAD:feat/phase7c-lot-range-120
