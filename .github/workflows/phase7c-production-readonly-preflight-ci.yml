name: Phase7C Production Readonly Preflight CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/check-phase7c-production-readonly-preflight-local.ps1"
      - "scripts/test-phase7c-production-readonly-preflight-source.ps1"
      - ".github/workflows/phase7c-production-readonly-preflight-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/check-phase7c-production-readonly-preflight-local.ps1"
      - "scripts/test-phase7c-production-readonly-preflight-source.ps1"
      - ".github/workflows/phase7c-production-readonly-preflight-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Production read-only preflight contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-production-readonly-preflight-source.ps1
      - name: Production read-only preflight contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-production-readonly-preflight-source.ps1
