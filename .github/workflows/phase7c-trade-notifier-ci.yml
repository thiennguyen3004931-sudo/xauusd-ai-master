name: Phase7C Trade Notifier CI

on:
  push:
    branches:
      - fix/phase7c-trade-notifier-supervision
      - fix/phase7c-telegram-recovery-position-context
    paths:
      - scripts/run-phase7b-telegram-notifier-local.ps1
      - scripts/run-phase7b-telegram-notifier.mjs
      - scripts/run-phase7c-executors-local.ps1
      - scripts/test-phase7c-trade-notifier-source.ps1
      - scripts/test-phase7c-trade-notifier-wrapper.ps1
      - scripts/phase7c-trade-notifier-synthetic.test.mjs
      - scripts/phase7c-sideway-production-telegram-sample.test.mjs
      - scripts/send-phase7c-sideway-production-telegram-sample.mjs
      - scripts/apply-phase7c-telegram-recovery-context-fix.mjs
      - .github/workflows/phase7c-trade-notifier-ci.yml
  pull_request:
    paths:
      - scripts/run-phase7b-telegram-notifier-local.ps1
      - scripts/run-phase7b-telegram-notifier.mjs
      - scripts/run-phase7c-executors-local.ps1
      - scripts/test-phase7c-trade-notifier-source.ps1
      - scripts/test-phase7c-trade-notifier-wrapper.ps1
      - scripts/phase7c-trade-notifier-synthetic.test.mjs
      - scripts/phase7c-sideway-production-telegram-sample.test.mjs
      - scripts/send-phase7c-sideway-production-telegram-sample.mjs
      - .github/workflows/phase7c-trade-notifier-ci.yml

permissions:
  contents: write

jobs:
  apply-recovery-context-fix:
    name: apply-recovery-context-fix
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/phase7c-telegram-recovery-position-context' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase7c-telegram-recovery-position-context
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact notifier source patch
        run: node ./scripts/apply-phase7c-telegram-recovery-context-fix.mjs

      - name: Notifier JavaScript syntax
        run: node --check ./scripts/run-phase7b-telegram-notifier.mjs

      - name: Focused synthetic regression
        run: node --test ./scripts/phase7c-trade-notifier-synthetic.test.mjs

      - name: Commit verified notifier source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-telegram-notifier.mjs
          git diff --cached --quiet && { echo "No notifier source change to commit."; exit 1; }
          git commit -m "fix: preserve Telegram recovery position context"
          git push origin HEAD:fix/phase7c-telegram-recovery-position-context

  regression:
    name: notifier-supervision-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Supervisor, wrapper, and startup safety contract
        shell: pwsh
        run: ./scripts/test-phase7c-trade-notifier-source.ps1

      - name: Notifier JavaScript syntax
        run: node --check ./scripts/run-phase7b-telegram-notifier.mjs

      - name: Wrapper LIVE and DEMO journal integration
        shell: pwsh
        run: ./scripts/test-phase7c-trade-notifier-wrapper.ps1

      - name: Synthetic ENTRY-HOLD-BE-partial-EXIT lifecycle
        run: node --test ./scripts/phase7c-trade-notifier-synthetic.test.mjs

      - name: Production-format Sideway Telegram sample harness
        run: node --test ./scripts/phase7c-sideway-production-telegram-sample.test.mjs
