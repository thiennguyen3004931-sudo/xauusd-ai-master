name: Phase7C Startup Runner Guard CI

on:
  push:
    branches:
      - fix/phase7c-startup-runner-singleton
      - fix/phase7c-startup-acceptance-verifier
    paths:
      - "scripts/lib/phase7c-startup-runner-guard.ps1"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/run-phase7c-executors-local.ps1"
      - "scripts/verify-phase7c-startup-acceptance-local.ps1"
      - "scripts/test-phase7c-startup-runner-guard-local.ps1"
      - "scripts/test-phase7c-startup-acceptance-source.ps1"
      - ".github/workflows/phase7c-startup-runner-guard-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/lib/phase7c-startup-runner-guard.ps1"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/run-phase7c-executors-local.ps1"
      - "scripts/verify-phase7c-startup-acceptance-local.ps1"
      - "scripts/test-phase7c-startup-runner-guard-local.ps1"
      - "scripts/test-phase7c-startup-acceptance-source.ps1"
      - ".github/workflows/phase7c-startup-runner-guard-ci.yml"

permissions:
  contents: read

jobs:
  singleton-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Startup runner guard with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-guard-local.ps1

      - name: Startup acceptance source contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-acceptance-source.ps1

      - name: Startup runner guard with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-guard-local.ps1

      - name: Startup acceptance source contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-acceptance-source.ps1
