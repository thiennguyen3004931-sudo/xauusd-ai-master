name: Phase7C Web API Cold Build Readiness CI

on:
  push:
    branches:
      - fix/phase7c-web-api-cold-build-readiness
    paths:
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/run-phase7b-api-runtime-local.ps1"
      - "scripts/test-phase7c-web-api-cold-build-readiness-local.ps1"
      - ".github/workflows/phase7c-web-api-cold-build-readiness-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/run-phase7b-api-runtime-local.ps1"
      - "scripts/test-phase7c-web-api-cold-build-readiness-local.ps1"
      - ".github/workflows/phase7c-web-api-cold-build-readiness-ci.yml"

permissions:
  contents: read

jobs:
  cold-build-readiness-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-api-cold-build-readiness-local.ps1
      - name: Contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-api-cold-build-readiness-local.ps1
