name: Trend Intrabar Pullback Apply TEMP

on:
  push:
    branches:
      - fix/trend-intrabar-next-m15-pullback
    paths:
      - ".github/workflows/trend-intrabar-pullback-apply-temp.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/trend-intrabar-next-m15-pullback
          fetch-depth: 0

      - name: Guard expected RED head ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 1a15acee4b97602449bea38489fc1742273aa327 HEAD
          echo "FEATURE_HEAD_BEFORE_PATCH=$(git rev-parse HEAD)"

      - name: Apply exact minimal production patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(text, oldText, newText, label) {
            const count = text.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one target, found ${count}`);
            return text.replace(oldText, newText);
          }

          const controllerPath = 'scripts/run-phase7b-demo-controller.ts';
          let controller = fs.readFileSync(controllerPath, 'utf8');

          controller = replaceOnce(
            controller,
            'const pullbackWaitMinutes = Math.max(1, Number(process.env.ZIQ_PHASE7B_PULLBACK_WAIT_MINUTES ?? "15"));',
            'const pullbackWaitMinutes = 15;',
            'canonical one-M15 pullback window',
          );

          controller = replaceOnce(
            controller,
            `  if (state.pendingPullback) {
    const pending = state.pendingPullback;
    if (latestM5.closeTime <= state.lastEvaluatedM5Close) return;
    state.lastEvaluatedM5Close = latestM5.closeTime;
    saveState();

`,
            `  if (state.pendingPullback) {
    const pending = state.pendingPullback;
    const pullbackCycleTimestamp = Number(quote.timestamp);
    if (!Number.isFinite(pullbackCycleTimestamp)) {
      journal("QUOTE_TIMESTAMP_INVALID", {
        signalId: pending.signalId,
        quoteTimestamp: quote.timestamp,
      });
      return;
    }

`,
            'intrabar pending-cycle gate',
          );

          controller = replaceOnce(
            controller,
            `    if (!entryConditions || !entryConditions.allEnabledPassed) {
      journal("ENTRY_STRATEGY_CONDITION_BLOCK", {
        signalId: pending.signalId,
        side: pending.side,
        pattern: pending.pattern,
        reason: entryConditions
          ? entryConditions.failedConditions.join(",")
          : "ENTRY_STRATEGY_CONFIG_INVALID",
        configError: strategyEntryConfig.error,
        entryConditions,
      });
      return;
    }

    journal("ENTRY_STRATEGY_CONDITIONS_PASS", {
      signalId: pending.signalId,
      side: pending.side,
      pattern: pending.pattern,
      entryConditions,
    });

    const conditionAllows = (id: string) =>
      entryConditions.conditions.find((row) => row.id === id)?.status !== "FAIL";
    const evaluation = pullbackEntryService.evaluatePullback({
      pending,
      timestamp: latestM5.closeTime,
      candidateEntryPrice: marketEntry,
      barLow: latestM5.low,
      barHigh: latestM5.high,
      setupStillValid: conditionAllows("validTrendStructure"),
      m15SupertrendAligned: conditionAllows("supertrendM15"),
      m5SupertrendAligned: conditionAllows("supertrendM5"),
    });
`,
            `    const evaluation = pullbackEntryService.evaluatePullback({
      pending,
      timestamp: pullbackCycleTimestamp,
      candidateEntryPrice: marketEntry,
      barLow: latestM5.low,
      barHigh: latestM5.high,
      setupStillValid: structuralStopDistance > 0,
      m15SupertrendAligned: m15Direction === pending.side,
      m5SupertrendAligned: m5Direction === pending.side,
    });
`,
            'pullback lifecycle before optional strategy gate',
          );

          controller = replaceOnce(
            controller,
            `      m5CloseTime: latestM5.closeTime,
      expiresAt: pending.expiresAt,
`,
            `      m5CloseTime: latestM5.closeTime,
      pullbackCycleTimestamp,
      expiresAt: pending.expiresAt,
`,
            'pullback cycle observability',
          );

          controller = replaceOnce(
            controller,
            `    if (evaluation.state === "PULLBACK_STILL_TOO_WIDE") return;
    if (evaluation.state !== "PULLBACK_ENTRY") {
      state.pendingPullback = null;
      saveState();
      return;
    }

    const signal: RuntimeEntrySignal = {
`,
            `    if (evaluation.state === "PULLBACK_STILL_TOO_WIDE") return;
    if (evaluation.state !== "PULLBACK_ENTRY") {
      state.pendingPullback = null;
      saveState();
      return;
    }

    if (!entryConditions || !entryConditions.allEnabledPassed) {
      journal("ENTRY_STRATEGY_CONDITION_BLOCK", {
        signalId: pending.signalId,
        side: pending.side,
        pattern: pending.pattern,
        reason: entryConditions
          ? entryConditions.failedConditions.join(",")
          : "ENTRY_STRATEGY_CONFIG_INVALID",
        configError: strategyEntryConfig.error,
        entryConditions,
      });
      return;
    }

    journal("ENTRY_STRATEGY_CONDITIONS_PASS", {
      signalId: pending.signalId,
      side: pending.side,
      pattern: pending.pattern,
      entryConditions,
    });

    const signal: RuntimeEntrySignal = {
`,
            'optional strategy gate after terminal lifecycle',
          );

          if (controller.includes('ZIQ_PHASE7B_PULLBACK_WAIT_MINUTES')) throw new Error('legacy configurable pullback window still present');
          if (controller.includes('timestamp: latestM5.closeTime')) throw new Error('pending pullback still uses M5 close timestamp');
          fs.writeFileSync(controllerPath, controller, 'utf8');

          const servicePath = 'packages/risk-engine/src/services/Phase7BPullbackEntryService.ts';
          let service = fs.readFileSync(servicePath, 'utf8');
          service = replaceOnce(
            service,
            '    if (input.timestamp > pending.expiresAt) {',
            '    if (input.timestamp >= pending.expiresAt) {',
            'inclusive pullback expiry boundary',
          );
          fs.writeFileSync(servicePath, service, 'utf8');
          NODE

          git diff --check
          git diff -- scripts/run-phase7b-demo-controller.ts packages/risk-engine/src/services/Phase7BPullbackEntryService.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build risk-engine dependency graph
        run: pnpm --filter @xauusd/risk-engine... build

      - name: Typecheck risk-engine
        run: pnpm --filter @xauusd/risk-engine typecheck

      - name: Test risk-engine
        run: pnpm --filter @xauusd/risk-engine test

      - name: Verify controller hook remains compatible
        shell: bash
        run: |
          node --check scripts/apply-phase7b-wait-pullback-demo-controller-hook.mjs
          cp scripts/run-phase7b-demo-controller.ts .phase7b-controller-ci.ts
          node scripts/apply-phase7b-wait-pullback-demo-controller-hook.mjs .phase7b-controller-ci.ts
          node scripts/apply-phase7b-wait-pullback-demo-controller-hook.mjs .phase7b-controller-ci.ts
          grep -q 'PHASE7B_DEMO_STRUCTURAL_SL_GT_10=WAIT_PULLBACK' .phase7b-controller-ci.ts
          grep -q 'PHASE7B_DEMO_ENTRY_GATE=PATTERN_PLUS_SUPERTREND_M15_M5_PLUS_VALID_STRUCTURE' .phase7b-controller-ci.ts
          grep -q 'pendingPullback' .phase7b-controller-ci.ts
          grep -q 'PLUS6_SL_TO_ENTRY' .phase7b-controller-ci.ts
          grep -q 'PLUS10_PARTIAL_ONE_THIRD' .phase7b-controller-ci.ts
          grep -q 'REVERSAL_FVG_REJECTION' .phase7b-controller-ci.ts
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const file = '.phase7b-controller-ci.ts';
          const source = fs.readFileSync(file, 'utf8');
          const result = ts.transpileModule(source, {
            fileName: file,
            reportDiagnostics: true,
            compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext },
          });
          const errors = (result.diagnostics ?? []).filter((d) => d.category === ts.DiagnosticCategory.Error);
          if (errors.length) {
            for (const diagnostic of errors) console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n'));
            process.exit(1);
          }
          console.log('PHASE7B_DEMO_CONTROLLER_TRANSPILE=PASS');
          NODE
          rm -f .phase7b-controller-ci.ts .phase7b-controller-ci.ts.phase7b-wait-pullback.bak

      - name: Commit tested production patch
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts packages/risk-engine/src/services/Phase7BPullbackEntryService.ts
          git diff --cached --check
          git diff --cached --quiet && { echo "No production diff to commit"; exit 1; }
          git commit -m "fix: evaluate Trend pullback intrabar until M15 expiry"
          git push origin HEAD:fix/trend-intrabar-next-m15-pullback
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
