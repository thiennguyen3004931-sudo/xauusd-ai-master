name: Apply Phase7C UI Entry Wait Reason Freshness Patch

on:
  push:
    branches:
      - fix/phase7c-ui-entry-wait-reason-freshness
    paths:
      - ".github/workflows/_apply-phase7c-ui-entry-wait-reason-freshness.yml"

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-ui-entry-wait-reason-freshness
          fetch-depth: 0
      - name: Apply exact wait-reason freshness transform
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/services/phase7c-ui-contract.service.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    if (\n      event.toUpperCase() === "ENTRY_MODE_BLOCK" &&\n      snapshot.generatedAt - Number(row.timestamp) > 30 * 60_000\n    ) continue;\n'''
          new = '''    if (snapshot.generatedAt - Number(row.timestamp) > 30 * 60_000) continue;\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exact freshness block once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_apply-phase7c-ui-entry-wait-reason-freshness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/phase7c-ui-contract.service.ts .github/workflows/_apply-phase7c-ui-entry-wait-reason-freshness.yml
          git commit -m "fix(phase7c): expire stale entry wait reasons"
          git push origin HEAD:fix/phase7c-ui-entry-wait-reason-freshness
