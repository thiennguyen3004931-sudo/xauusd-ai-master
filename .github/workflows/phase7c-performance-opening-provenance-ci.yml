name: Phase7C Performance Opening Provenance CI

on:
  push:
    branches:
      - fix/phase7c-performance-opening-provenance-web-contract
    paths:
      - "apps/api/src/services/mt5-performance.service.ts"
      - "apps/api/src/services/phase7c-source-safety.service.ts"
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/web/src/api.ts"
      - "apps/web/src/phase7c-types.ts"
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "scripts/test-phase7c-performance-opening-provenance-contract.mjs"
      - "scripts/test-phase7c-web-safety-contract.mjs"
      - ".github/workflows/phase7c-performance-opening-provenance-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/services/mt5-performance.service.ts"
      - "apps/api/src/services/phase7c-source-safety.service.ts"
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/web/src/api.ts"
      - "apps/web/src/phase7c-types.ts"
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "scripts/test-phase7c-performance-opening-provenance-contract.mjs"
      - "scripts/test-phase7c-web-safety-contract.mjs"
      - ".github/workflows/phase7c-performance-opening-provenance-ci.yml"

permissions:
  contents: read

jobs:
  opening-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Performance opening provenance contract
        run: node --test scripts/test-phase7c-performance-opening-provenance-contract.mjs
      - name: Run Web source safety contract
        run: node --test scripts/test-phase7c-web-safety-contract.mjs

  builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Build Web
        run: pnpm --filter @xauusd/web... build

  source-safety:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle broker source contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Lifecycle broker source contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
