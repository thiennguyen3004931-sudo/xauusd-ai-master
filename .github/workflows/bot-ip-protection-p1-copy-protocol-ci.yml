name: BOT IP Protection P1 Copy Protocol CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/copy-protocol/**"
      - ".github/workflows/bot-ip-protection-p1-copy-protocol-ci.yml"
      - "scripts/test-bot-ip-protection-p1-boundary.mjs"

permissions:
  contents: read

jobs:
  copy-protocol:
    name: copy-protocol-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies for TDD branch
        run: pnpm install --no-frozen-lockfile
      - name: Protocol tests
        run: pnpm --filter @xauusd/copy-protocol test
