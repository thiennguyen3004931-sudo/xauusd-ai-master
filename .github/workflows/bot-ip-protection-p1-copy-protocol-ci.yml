name: BOT IP Protection P1 Copy Protocol CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/copy-protocol/**"
      - ".github/workflows/bot-ip-protection-p1-copy-protocol-ci.yml"
      - "scripts/test-bot-ip-protection-p1-boundary.mjs"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  copy-protocol:
    name: copy-protocol-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "LOCKFILE_CHANGE=NONE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(copy-protocol): update pnpm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Protocol tests
        run: pnpm --filter @xauusd/copy-protocol test
      - name: Protocol typecheck
        run: pnpm --filter @xauusd/copy-protocol typecheck
      - name: Protocol build
        run: pnpm --filter @xauusd/copy-protocol build
      - name: IP boundary contract
        run: node --test scripts/test-bot-ip-protection-p1-boundary.mjs
