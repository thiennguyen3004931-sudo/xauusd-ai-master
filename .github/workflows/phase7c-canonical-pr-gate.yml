name: Phase7C Canonical PR Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: canonical-pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-linux:
    name: canonical-pr-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonical gate source contract
        run: node --test scripts/test-phase7c-canonical-pr-gate-contract.mjs
      - name: Build and test broker risk strategy foundations
        run: |
          pnpm --filter @xauusd/mt5-broker... build
          pnpm --filter @xauusd/risk-engine... build
          pnpm --filter @xauusd/risk-engine typecheck
          pnpm --filter @xauusd/risk-engine test
          pnpm --filter @xauusd/strategy-engine... build
          pnpm --filter @xauusd/strategy-engine typecheck
          pnpm --filter @xauusd/strategy-engine test
      - name: Canonical strategy and recovery contracts
        run: |
          node scripts/test-phase7c-strategy-entry-conditions-core-contract.mjs
          node scripts/test-phase7c-trend-entry-recovery-contract.mjs
          node scripts/test-phase7c-sideway-recovery-management-contract.mjs
          node scripts/test-phase7c-canonical-daily-recovery-executors-contract.mjs
      - name: Structural and execution safety regressions
        run: |
          node --test scripts/test-phase7c-structural-sl-monotonicity.mjs
          node --test scripts/phase7c-sideway-logic.test.mjs
          node --test scripts/phase7c-sideway-execution-guards.test.mjs
          node --test scripts/phase7c-execution-lock.test.mjs
      - name: Broker-native Fixed TP regressions
        run: |
          node --test scripts/phase7c-fixed-tp.test.mjs
          node --test scripts/phase7c-fixed-tp-runtime-wiring.test.mjs
          node --test scripts/phase7c-fixed-tp-trend-snapshot.test.mjs
          node --test scripts/phase7c-fixed-tp-trend-exit.test.mjs
          node --test scripts/phase7c-fixed-tp-sideway-snapshot.test.mjs
          node --test scripts/phase7c-fixed-tp-sideway-exit.test.mjs
      - name: Build API and Web dependency graphs
        run: |
          pnpm --filter @xauusd/api... build
          pnpm --filter @xauusd/web... build
      - name: Parse canonical trading controllers
        run: |
          node --check scripts/run-phase7c-trend-controller.mjs
          node --check scripts/run-phase7c-sideway-controller.mjs
          node --check scripts/run-phase7c-sideway-locked.mjs
      - name: Diff hygiene
        run: git diff --check

  canonical-windows:
    name: canonical-pr-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lifecycle broker source contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Lifecycle broker source contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Lifecycle broker protocol contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1
      - name: Lifecycle broker protocol contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1
      - name: Lifecycle broker ACL contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-lifecycle-broker-acl-source.ps1
      - name: Lifecycle broker ACL contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-lifecycle-broker-acl-source.ps1
      - name: Web LIVE ARM and DEMO AUTO contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-live-arm-demo-auto-source.ps1
      - name: Web LIVE ARM and DEMO AUTO contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-live-arm-demo-auto-source.ps1
      - name: Activation safety contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-activation-safety-source.ps1
      - name: Activation safety contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-activation-safety-source.ps1
      - name: LIVE risk fail-closed contract - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-risk-profile-source.ps1
      - name: LIVE risk fail-closed contract - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-risk-profile-source.ps1
      - name: Diff hygiene
        shell: pwsh
        run: git diff --check
