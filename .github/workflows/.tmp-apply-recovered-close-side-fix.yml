name: Temporary Apply Recovered Close Side Fix

on:
  push:
    branches:
      - fix/phase7c-recovered-entry-close-pnl

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase7c-recovered-entry-close-pnl
          fetch-depth: 0

      - name: Apply exact source patch
        run: node ./scripts/.tmp-apply-recovered-close-side-fix.mjs

      - name: Verify targeted regression GREEN before commit
        run: |
          node --check ./scripts/run-phase7b-telegram-notifier.mjs
          node --test ./scripts/phase7c-recovered-entry-close-context.test.mjs

      - name: Commit production fix and remove temporary helpers
        shell: bash
        run: |
          rm -f ./scripts/.tmp-apply-recovered-close-side-fix.mjs
          rm -f ./.github/workflows/.tmp-apply-recovered-close-side-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(phase7c): preserve recovered close side context"
          git push origin HEAD:fix/phase7c-recovered-entry-close-pnl
