name: Apply Phase7C Current PreTrade Freshness Patch

on:
  push:
    branches:
      - fix/phase7c-current-pretrade-freshness
    paths:
      - ".github/workflows/_apply-phase7c-current-pretrade-freshness.yml"

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-current-pretrade-freshness
      - name: Apply exact backend freshness transform
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/services/phase7c-decision-monitor.service.ts")
          text = path.read_text(encoding="utf-8")

          old_anchor = '''  const currentDecision = Boolean(latest && now - latest.timestamp <= 30 * 60_000);\n  const executorReady = currentDecision && new Set(["READY", "SUBMITTED"]).has(String(latest?.stage));\n'''
          new_anchor = '''  const currentDecision = Boolean(latest && now - latest.timestamp <= 30 * 60_000);\n  const current = currentDecision ? latest : null;\n  const executorReady = currentDecision && new Set(["READY", "SUBMITTED"]).has(String(latest?.stage));\n'''

          replacements = {
            '    side: latest?.setup?.side ?? null,': '    side: current?.setup?.side ?? null,',
            '    setup: latest?.setup?.pattern ?? null,': '    setup: current?.setup?.pattern ?? null,',
            '    entry: round(finite(latest?.plan?.entry), 5),': '    entry: round(finite(current?.plan?.entry), 5),',
            '    stopLoss: round(finite(latest?.plan?.stopLoss), 5),': '    stopLoss: round(finite(current?.plan?.stopLoss), 5),',
            '    stopDistance: round(finite(latest?.plan?.stopDistance), 5),': '    stopDistance: round(finite(current?.plan?.stopDistance), 5),',
            '    breakEvenPrice: round(finite(latest?.plan?.breakEvenPrice), 5),': '    breakEvenPrice: round(finite(current?.plan?.breakEvenPrice), 5),',
            '    tp1: round(finite(latest?.plan?.tp1), 5),': '    tp1: round(finite(current?.plan?.tp1), 5),',
            '    tp2: round(finite(latest?.plan?.tp2), 5),': '    tp2: round(finite(current?.plan?.tp2), 5),',
            '    rawLot: round(finite(latest?.sizing?.rawLot), 4),': '    rawLot: round(finite(current?.sizing?.rawLot), 4),',
            '    finalLot: round(finite(latest?.sizing?.finalLot), 2),': '    finalLot: round(finite(current?.sizing?.finalLot), 2),',
            '    lotCap: round(finite(latest?.sizing?.maxLot) ?? activeMaxLot, 2),': '    lotCap: round(finite(current?.sizing?.maxLot) ?? activeMaxLot, 2),',
            '    riskTargetPercent: round(finite(latest?.sizing?.riskPercent) ?? activeRisk, 2),': '    riskTargetPercent: round(finite(current?.sizing?.riskPercent) ?? activeRisk, 2),',
            '    estimatedRiskUsd: round(finite(latest?.sizing?.estimatedRiskUsd), 2),': '    estimatedRiskUsd: round(finite(current?.sizing?.estimatedRiskUsd), 2),',
            '    estimatedRiskPercent: round(finite(latest?.sizing?.estimatedRiskPercent), 4),': '    estimatedRiskPercent: round(finite(current?.sizing?.estimatedRiskPercent), 4),',
            '      : latest?.sizing?.limitReason ??': '      : current?.sizing?.limitReason ??',
            '      ? latest?.reason ?? "Chờ Sideway setup."': '      ? current?.reason ?? "Chờ Sideway setup."',
            '    source: latest?.source ?? "SIDEWAY_EXECUTOR_CANONICAL_JOURNAL",': '    source: current?.source ?? "SIDEWAY_EXECUTOR_CANONICAL_JOURNAL",',
            '    updatedAt: latest?.timestamp ?? now,': '    updatedAt: current?.timestamp ?? now,',
          }

          if text.count(old_anchor) != 1:
              raise SystemExit(f"expected exactly one currentDecision anchor, found {text.count(old_anchor)}")
          text = text.replace(old_anchor, new_anchor, 1)
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one target: {old!r}; found {text.count(old)}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-phase7c-current-pretrade-freshness.yml
          git add apps/api/src/services/phase7c-decision-monitor.service.ts
          git diff --cached --check
          git commit -m "fix(phase7c): expire stale current pre-trade data"
          git push origin HEAD:fix/phase7c-current-pretrade-freshness
