name: Phase7C HOLD M15 Apply

on:
  push:
    branches:
      - feat/phase7c-hold-m15-dedupe
    paths:
      - scripts/apply-phase7c-hold-m15-dedupe-patch.mjs
      - .github/workflows/phase7c-hold-m15-apply.yml

permissions:
  contents: write

jobs:
  apply:
    name: apply-hold-m15-replacement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phase7c-hold-m15-dedupe
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic production patch
        run: node ./scripts/apply-phase7c-hold-m15-dedupe-patch.mjs

      - name: Verify focused contracts before commit
        run: |
          node --check ./scripts/run-phase7b-telegram-notifier.mjs
          node --check ./scripts/run-phase7c-sideway-controller.mjs
          node --test ./scripts/test-phase7c-hold-m15-dedupe-contract.mjs
          node --test ./scripts/test-phase7c-hold-telegram-dedupe-contract.mjs
          git diff --check

      - name: Commit production replacement only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-telegram-notifier.mjs scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs
          git commit -m "fix(phase7c): dedupe HOLD once per M15 candle"
          git push origin HEAD:feat/phase7c-hold-m15-dedupe
