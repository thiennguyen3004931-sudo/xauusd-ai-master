name: Phase7C System Lifecycle Broker CI

on:
  push:
    branches:
      - feat/phase7c-system-lifecycle-broker
    paths:
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "apps/api/src/services/phase7c-lifecycle-broker.service.ts"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/lib/phase7c-lifecycle-broker.ps1"
      - "scripts/test-phase7c-system-lifecycle-broker-source.ps1"
      - ".github/workflows/phase7c-system-lifecycle-broker-ci.yml"
  pull_request:
    paths:
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "apps/api/src/services/phase7c-lifecycle-broker.service.ts"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/lib/phase7c-lifecycle-broker.ps1"
      - "scripts/test-phase7c-system-lifecycle-broker-source.ps1"
      - ".github/workflows/phase7c-system-lifecycle-broker-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lifecycle broker source contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1

      - name: Lifecycle broker source contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
