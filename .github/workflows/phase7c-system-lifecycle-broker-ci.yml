name: Phase7C System Lifecycle Broker CI

on:
  push:
    branches:
      - feat/phase7c-system-lifecycle-broker
    paths:
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "apps/api/src/services/phase7c-lifecycle-broker.service.ts"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/lib/phase7c-lifecycle-broker.ps1"
      - "scripts/test-phase7c-system-lifecycle-broker-source.ps1"
      - "scripts/test-phase7c-system-lifecycle-broker-contract.ps1"
      - "scripts/test-phase7c-lifecycle-broker-acl-source.ps1"
      - ".github/workflows/phase7c-system-lifecycle-broker-ci.yml"
  pull_request:
    paths:
      - "apps/api/src/services/phase7c-lifecycle.service.ts"
      - "apps/api/src/services/phase7c-lifecycle-broker.service.ts"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/register-phase7c-executor-task-local.ps1"
      - "scripts/lib/phase7c-lifecycle-broker.ps1"
      - "scripts/test-phase7c-system-lifecycle-broker-source.ps1"
      - "scripts/test-phase7c-system-lifecycle-broker-contract.ps1"
      - "scripts/test-phase7c-lifecycle-broker-acl-source.ps1"
      - ".github/workflows/phase7c-system-lifecycle-broker-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lifecycle broker source contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1

      - name: Lifecycle broker source contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1

  protocol-safety-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Broker protocol and safety contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1

      - name: Broker protocol and safety contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1

  acl-source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lifecycle broker ACL contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-lifecycle-broker-acl-source.ps1

      - name: Lifecycle broker ACL contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-lifecycle-broker-acl-source.ps1

  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

  web-lifecycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Web auto-account lifecycle regression
        run: pnpm --filter @xauusd/api exec tsx ../../scripts/test-phase7c-web-auto-account-start.ts
      - name: Existing dual-account regression
        run: node scripts/test-phase7c-dual-account-mode.mjs
      - name: Web LIVE Start fail-closed source assertions
        run: node scripts/test-phase7c-web-live-start-guard-source.mjs
      - name: Build risk engine dependency graph
        run: pnpm --filter @xauusd/risk-engine... build
      - name: Build API
        run: pnpm --filter @xauusd/api... build
      - name: Build Web
        run: pnpm --filter @xauusd/web... build

  windows-full-regression:
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare runtime directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .runtime | Out-Null
      - name: Sideway regime source regression
        shell: pwsh
        run: .\scripts\test-phase7c-sideway-regime-source.ps1
      - name: Sideway regime runtime regression
        shell: pwsh
        run: .\scripts\test-phase7c-sideway-regime-runtime.ps1
      - name: LIVE ARM safety contract
        shell: powershell
        run: .\scripts\test-phase7c-live-arm-contract.ps1
      - name: Startup runner guard with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-guard-local.ps1
      - name: Startup acceptance source contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-acceptance-source.ps1
      - name: Startup runner guard with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-guard-local.ps1
      - name: Startup acceptance source contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-acceptance-source.ps1
      - name: Trade notifier source regression
        shell: powershell
        run: .\scripts\test-phase7c-trade-notifier-source.ps1
      - name: Trade notifier runtime regression
        shell: powershell
        run: .\scripts\test-phase7c-trade-notifier-runtime.ps1
      - name: Telegram firewall source regression
        shell: powershell
        run: .\scripts\test-phase7c-telegram-firewall-source.ps1
