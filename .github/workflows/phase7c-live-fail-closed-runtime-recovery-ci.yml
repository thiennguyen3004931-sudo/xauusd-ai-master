name: Phase7C LIVE Fail-Closed Runtime Recovery CI

on:
  pull_request:
    paths:
      - "scripts/recover-phase7c-live-fail-closed-runtime-local.ps1"
      - "scripts/test-phase7c-live-fail-closed-runtime-recovery-source.ps1"
      - ".github/workflows/phase7c-live-fail-closed-runtime-recovery-ci.yml"
  push:
    branches:
      - fix/phase7c-fail-closed-runtime-recovery
    paths:
      - "scripts/recover-phase7c-live-fail-closed-runtime-local.ps1"
      - "scripts/test-phase7c-live-fail-closed-runtime-recovery-source.ps1"
      - ".github/workflows/phase7c-live-fail-closed-runtime-recovery-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: LIVE fail-closed recovery contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1
      - name: LIVE fail-closed recovery contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1

  lifecycle-safety-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Executor supervisor-first stop order contract
        shell: pwsh
        run: .\scripts\test-phase7c-executor-stop-order-source.ps1
      - name: Lifecycle broker source contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-source.ps1
      - name: Lifecycle broker protocol safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-system-lifecycle-broker-contract.ps1
      - name: LIVE ARM source safety contract
        shell: pwsh
        run: .\scripts\test-phase7c-live-arm-source.ps1
      - name: Startup runner guard contract
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-guard-local.ps1
      - name: Startup acceptance source contract
        shell: pwsh
        run: .\scripts\test-phase7c-startup-acceptance-source.ps1
