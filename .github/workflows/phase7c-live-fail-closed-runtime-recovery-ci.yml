name: Phase7C LIVE Fail-Closed Runtime Recovery CI

on:
  pull_request:
    paths:
      - "scripts/recover-phase7c-live-fail-closed-runtime-local.ps1"
      - "scripts/test-phase7c-live-fail-closed-runtime-recovery-source.ps1"
      - ".github/workflows/phase7c-live-fail-closed-runtime-recovery-ci.yml"
  push:
    branches:
      - fix/phase7c-fail-closed-runtime-recovery
    paths:
      - "scripts/recover-phase7c-live-fail-closed-runtime-local.ps1"
      - "scripts/test-phase7c-live-fail-closed-runtime-recovery-source.ps1"
      - ".github/workflows/phase7c-live-fail-closed-runtime-recovery-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: LIVE fail-closed recovery contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1
      - name: LIVE fail-closed recovery contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-live-fail-closed-runtime-recovery-source.ps1
