name: Phase7C Fixed TP Broker Native Applier

on:
  push:
    branches:
      - feat/phase7c-fixed-tp-broker-native
    paths:
      - .github/workflows/phase7c-fixed-tp-broker-native-applier.yml
      - .github/scripts/apply-phase7c-fixed-tp-broker-native.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase7c-fixed-tp-broker-native
          fetch-depth: 0
      - name: Apply exact patch
        run: python .github/scripts/apply-phase7c-fixed-tp-broker-native.py
      - name: Verify and commit
        run: |
          node --check scripts/run-phase7c-sideway-controller.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs
          git diff --cached --check
          git commit -m "feat: attach Fixed TP to broker positions"
          git push origin HEAD:feat/phase7c-fixed-tp-broker-native
