name: Apply Sideway Fixed TP Task 6

on:
  push:
    branches:
      - feat/phase7c-fixed-tp-additive
    paths:
      - "scripts/.tmp-apply-sideway-fixed-tp-snapshot.mjs"
      - "scripts/phase7c-fixed-tp-sideway-snapshot.test.mjs"
      - ".github/workflows/.tmp-apply-sideway-fixed-tp-snapshot.yml"

permissions:
  contents: write

jobs:
  apply-source-only-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source-only patch script
        run: node --check scripts/.tmp-apply-sideway-fixed-tp-snapshot.mjs
      - name: Apply Task 6 minimal production snapshot wiring
        run: node scripts/.tmp-apply-sideway-fixed-tp-snapshot.mjs
      - name: Prove focused Sideway snapshot contract before commit
        run: node --test scripts/phase7c-fixed-tp-sideway-snapshot.test.mjs
      - name: Prove Task 7 exit logic remains untouched
        shell: bash
        run: |
          if grep -q "isFixedTpTriggered\|fixedTpCommandId\|closeFixedTpIfTriggered" scripts/run-phase7c-sideway-controller.mjs; then
            echo "TASK7_SCOPE_LEAK=TRUE"
            exit 1
          fi
          echo "TASK7_SCOPE_LEAK=FALSE"
      - name: Diff hygiene
        run: git diff --check
      - name: Commit only canonical Sideway source
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "scripts/run-phase7c-sideway-controller.mjs" ]; then
            echo "UNEXPECTED_DIFF=$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7c-sideway-controller.mjs
          git diff --cached --check
          git commit -m "feat: snapshot Sideway fixed TP at entry"
          git push origin HEAD:feat/phase7c-fixed-tp-additive
