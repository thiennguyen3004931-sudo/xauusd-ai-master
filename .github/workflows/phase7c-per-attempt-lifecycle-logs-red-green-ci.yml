name: Phase7C Per-Attempt Lifecycle Logs RED-GREEN CI

on:
  push:
    branches:
      - fix/phase7c-per-attempt-lifecycle-logs
    paths:
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/run-phase7c-executors-local.ps1"
      - "scripts/test-phase7c-per-attempt-lifecycle-logs-source.ps1"
      - ".github/workflows/phase7c-per-attempt-lifecycle-logs-red-green-ci.yml"

permissions:
  contents: read

jobs:
  per-attempt-source-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Per-attempt lifecycle log contract with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-per-attempt-lifecycle-logs-source.ps1
      - name: Per-attempt lifecycle log contract with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-per-attempt-lifecycle-logs-source.ps1

# GREEN trigger after bounded source fix; this one-shot workflow is removed before PR review.
