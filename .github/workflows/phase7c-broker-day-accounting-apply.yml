name: Phase7C Broker-Day Accounting Apply
# One-shot source migration only. No runtime, ARM, mode, bridge, or order mutation.

on:
  push:
    branches:
      - feat/phase7c-broker-day-accounting
    paths:
      - "scripts/apply-phase7c-broker-day-accounting.mjs"
      - ".github/workflows/phase7c-broker-day-accounting-apply.yml"

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase7c-broker-day-accounting
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply deterministic accounting migration
        run: node scripts/apply-phase7c-broker-day-accounting.mjs
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonical accounting behavior
        run: pnpm --filter @xauusd/mt5-broker exec vitest run src/accounting/broker-day-realized-pnl.test.ts
      - name: Consumer migration contract
        run: node --test scripts/test-phase7c-broker-day-accounting-consumers-contract.mjs
      - name: Build MT5 broker dependency graph
        run: pnpm --filter @xauusd/mt5-broker... build
      - name: Typecheck MT5 broker
        run: pnpm --filter @xauusd/mt5-broker typecheck
      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build
      - name: Sideway syntax check
        run: node --check scripts/run-phase7c-sideway-controller.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove one-shot scaffolding
        run: |
          git rm scripts/apply-phase7c-broker-day-accounting.mjs
          git rm .github/workflows/phase7c-broker-day-accounting-apply.yml
      - name: Verify production diff exists
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No production changes after accounting migration." >&2
            exit 1
          fi
      - name: Commit verified production migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(phase7c): canonicalize broker-day accounting consumers"
          git push origin HEAD:feat/phase7c-broker-day-accounting
