name: Phase7C Startup Runner Lock Lifetime CI

on:
  push:
    branches:
      - fix/phase7c-startup-runner-lock-lifetime
    paths:
      - "scripts/lib/phase7c-startup-runner-guard.ps1"
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/test-phase7c-startup-runner-lock-lifetime-local.ps1"
      - ".github/workflows/phase7c-startup-runner-lock-lifetime-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/lib/phase7c-startup-runner-guard.ps1"
      - "scripts/lib/phase7c-scheduled-task-ownership.ps1"
      - "scripts/run-phase7c-executor-task-runner-local.ps1"
      - "scripts/test-phase7c-startup-runner-lock-lifetime-local.ps1"
      - ".github/workflows/phase7c-startup-runner-lock-lifetime-ci.yml"

permissions:
  contents: read

jobs:
  lock-lifetime-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Startup runner lock lifetime - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-startup-runner-lock-lifetime-local.ps1
      - name: Startup runner lock lifetime - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-startup-runner-lock-lifetime-local.ps1
