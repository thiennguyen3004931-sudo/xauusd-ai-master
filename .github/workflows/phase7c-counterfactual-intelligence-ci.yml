name: Phase7C Counterfactual Intelligence CI

on:
  pull_request:
    paths:
      - "apps/api/src/contracts/phase7c-counterfactual-intelligence.schema.ts"
      - "apps/api/src/services/phase7c-counterfactual-evaluator.service.ts"
      - "apps/api/src/services/phase7c-counterfactual-intelligence.service.ts"
      - "apps/api/src/routes/phase7c-counterfactual-intelligence.route.ts"
      - "apps/api/src/app.ts"
      - "apps/web/src/phase7c-counterfactual-intelligence-types.ts"
      - "apps/web/src/phase7c-counterfactual-intelligence-api.ts"
      - "apps/web/src/ui/Phase7CCounterfactualIntelligenceCard.tsx"
      - "apps/web/src/pages/Phase7CControlCenterShellPage.tsx"
      - "scripts/phase7c-counterfactual-evaluator.test.ts"
      - "scripts/phase7c-counterfactual-intelligence.test.ts"
      - "scripts/test-phase7c-counterfactual-api-source.mjs"
      - "scripts/test-phase7c-counterfactual-intelligence-source.mjs"
      - "docs/superpowers/specs/2026-09-05-p3-closure-p4-counterfactual-intelligence.md"
      - "docs/superpowers/plans/2026-09-05-p3-closure-p4-counterfactual-intelligence.md"
      - ".github/workflows/phase7c-counterfactual-intelligence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: P4 counterfactual evaluator contract
        run: pnpm --filter @xauusd/api exec tsx ../../scripts/phase7c-counterfactual-evaluator.test.ts

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: P4 counterfactual snapshot contract
        run: pnpm --filter @xauusd/api exec tsx ../../scripts/phase7c-counterfactual-intelligence.test.ts

      - name: P4 GET-only API source contract
        run: node scripts/test-phase7c-counterfactual-api-source.mjs

      - name: P4 Control Center source contract
        run: node scripts/test-phase7c-counterfactual-intelligence-source.mjs

      - name: Build web dependency graph
        run: pnpm --filter @xauusd/web... build
