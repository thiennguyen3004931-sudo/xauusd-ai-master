name: Phase7C Mobile Read-Only M1 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/src/pages/Phase7CMobileReadOnlyPage.tsx"
      - "apps/web/src/router.tsx"
      - "apps/web/src/ui/DashboardLayout.tsx"
      - "apps/web/src/phase7c-panel-status.ts"
      - "apps/web/src/ui/Phase7COperatorStatusBar.tsx"
      - "scripts/test-phase7c-mobile-readonly-m1.mjs"
      - ".github/workflows/phase7c-mobile-readonly-m1-ci.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mobile read-only M1 source contract
        run: node scripts/test-phase7c-mobile-readonly-m1.mjs

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter @xauusd/web build
