name: Phase7C Telegram Lifecycle Apply Once

on:
  push:
    branches:
      - feat/phase7c-telegram-lifecycle-observability
    paths:
      - scripts/apply-phase7c-telegram-lifecycle-observability.mjs
      - .github/workflows/phase7c-telegram-lifecycle-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phase7c-telegram-lifecycle-observability

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply minimal lifecycle observability patch
        run: node ./scripts/apply-phase7c-telegram-lifecycle-observability.mjs

      - name: Notifier syntax
        run: node --check ./scripts/run-phase7b-telegram-notifier.mjs

      - name: New lifecycle contract GREEN
        run: node --test ./scripts/test-phase7c-telegram-lifecycle-observability-contract.mjs

      - name: Existing synthetic lifecycle regression
        run: node --test ./scripts/phase7c-trade-notifier-synthetic.test.mjs

      - name: Existing HOLD canonical/dedupe regression
        run: node --test ./scripts/test-phase7c-hold-telegram-dedupe-contract.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified production change and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-telegram-notifier.mjs
          git rm scripts/apply-phase7c-telegram-lifecycle-observability.mjs
          git rm .github/workflows/phase7c-telegram-lifecycle-apply-once.yml
          git commit -m "feat(phase7c): standardize Telegram lifecycle observability"
          git push origin HEAD:feat/phase7c-telegram-lifecycle-observability
