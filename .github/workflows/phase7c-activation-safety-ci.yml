name: Phase7C Activation Safety CI

on:
  push:
    branches:
      - fix/phase7c-activation-safety-regression
    paths:
      - "scripts/activate-phase7c-local.ps1"
      - "scripts/test-phase7c-activation-safety-source.ps1"
      - ".github/workflows/phase7c-activation-safety-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/activate-phase7c-local.ps1"
      - "scripts/test-phase7c-activation-safety-source.ps1"
      - ".github/workflows/phase7c-activation-safety-ci.yml"

permissions:
  contents: read

jobs:
  activation-safety:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shell:
          - pwsh
          - powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activation safety source regression
        shell: ${{ matrix.shell }}
        run: .\scripts\test-phase7c-activation-safety-source.ps1
