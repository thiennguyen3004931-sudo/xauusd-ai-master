name: Phase7C Web UI Broker Build TDD CI

on:
  push:
    branches:
      - fix/phase7c-web-ui-broker-build
    paths:
      - "scripts/deploy-phase7c-web-ui-local.ps1"
      - "scripts/test-phase7c-web-ui-safe-deploy-source.ps1"
      - ".github/workflows/phase7c-web-ui-broker-build-tdd-ci.yml"

permissions:
  contents: read

jobs:
  source-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Web UI safe deploy assertions with PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-web-ui-safe-deploy-source.ps1

      - name: Web UI safe deploy assertions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-web-ui-safe-deploy-source.ps1
