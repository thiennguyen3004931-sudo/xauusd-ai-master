name: TMP Phase7C FastMove Canonical Patch

on:
  push:
    branches:
      - fix/phase7c-fastmove-10-m5-handoff-canonical

permissions:
  contents: write

jobs:
  patch-canonical-constants:
    if: "${{ contains(github.event.head_commit.message, 'trigger: apply FastMove canonical patch') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7c-fastmove-10-m5-handoff-canonical
          fetch-depth: 0
      - name: Exact bounded source patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const patches = [
            {
              path: 'scripts/run-phase7b-demo-controller.ts',
              from: 'const FAST_MOVE_PROFIT_LOCK_GIVEBACK_PRICE = 6;',
              to: 'const FAST_MOVE_PROFIT_LOCK_GIVEBACK_PRICE = 10;',
            },
            {
              path: 'scripts/run-phase7c-sideway-controller.mjs',
              from: 'const FAST_MOVE_PROFIT_LOCK_GIVEBACK_PRICE = 4;',
              to: 'const FAST_MOVE_PROFIT_LOCK_GIVEBACK_PRICE = 10;',
            },
          ];
          for (const patch of patches) {
            const source = fs.readFileSync(patch.path, 'utf8');
            const count = source.split(patch.from).length - 1;
            if (count !== 1) {
              throw new Error(`${patch.path}: expected exactly one old FastMove constant, found ${count}`);
            }
            fs.writeFileSync(patch.path, source.replace(patch.from, patch.to), 'utf8');
            console.log(`PATCHED=${patch.path}|GIVEBACK=10`);
          }
          NODE
      - name: Guard exact diff scope
        shell: bash
        run: |
          git diff --check
          git diff --numstat -- scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs "
      - name: Commit bounded source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts scripts/run-phase7c-sideway-controller.mjs
          git commit -m "fix: canonicalize FastMove peak giveback to 10"
          git push origin HEAD:fix/phase7c-fastmove-10-m5-handoff-canonical
