name: Apply Fixed TP API Web Task 8

on:
  push:
    branches:
      - feat/phase7c-fixed-tp-additive
    paths:
      - "scripts/.tmp-apply-fixed-tp-api-web.mjs"
      - ".github/workflows/.tmp-apply-fixed-tp-api-web.yml"

permissions:
  contents: write

jobs:
  apply-source-only-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source-only patch helper
        run: node --check scripts/.tmp-apply-fixed-tp-api-web.mjs
      - name: Apply Task 8 minimal production patch
        run: node scripts/.tmp-apply-fixed-tp-api-web.mjs
      - name: Focused API Web contract
        run: node --test scripts/phase7c-fixed-tp-api-web.test.mjs
      - name: Build API with workspace dependencies
        run: pnpm exec turbo run build --filter=@xauusd/api
      - name: Build Web
        run: pnpm --filter @xauusd/web build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit only canonical Task 8 production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/phase7c.route.ts \
            apps/web/src/phase7c-types.ts \
            apps/web/src/api.ts \
            apps/web/src/pages/Phase7CControlCenterPage.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "FIXED_TP_API_WEB_COMMIT=NO_CHANGE"
            exit 0
          fi
          git commit -m "feat: expose additive fixed TP controls"
          git push origin HEAD:feat/phase7c-fixed-tp-additive
