name: Apply Trend Fixed TP Task 5

on:
  push:
    branches:
      - feat/phase7c-fixed-tp-additive
    paths:
      - "scripts/.tmp-apply-trend-fixed-tp-exit.mjs"
      - "scripts/phase7c-fixed-tp-trend-exit.test.mjs"
      - ".github/workflows/.tmp-apply-trend-fixed-tp-exit.yml"

permissions:
  contents: write

jobs:
  apply-source-only-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source-only patch script
        run: node --check scripts/.tmp-apply-trend-fixed-tp-exit.mjs
      - name: Apply Task 5 minimal production wiring
        run: node scripts/.tmp-apply-trend-fixed-tp-exit.mjs
      - name: Prove focused Trend exit contract before commit
        run: node --test scripts/phase7c-fixed-tp-trend-exit.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit only canonical Trend source
        shell: bash
        run: |
          if git diff --quiet -- scripts/run-phase7b-demo-controller.ts; then
            echo "TREND_FIXED_TP_EXIT_COMMIT=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-phase7b-demo-controller.ts
          git diff --cached --check
          git commit -m "feat: enforce Trend additive fixed TP exit"
          git push origin HEAD:feat/phase7c-fixed-tp-additive
