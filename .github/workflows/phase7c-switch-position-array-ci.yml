name: Phase7C Switch Position Array CI

on:
  push:
    branches:
      - fix/phase7c-switch-empty-position-array-pr
    paths:
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-switch-position-array-source.ps1"
      - ".github/workflows/phase7c-switch-position-array-ci.yml"
  pull_request:
    branches:
      - fix/phase7c-legacy-background-cleanup
    paths:
      - "scripts/switch-phase7c-account-mode-local.ps1"
      - "scripts/test-phase7c-switch-position-array-source.ps1"
      - ".github/workflows/phase7c-switch-position-array-ci.yml"

permissions:
  contents: read

jobs:
  source-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empty position array regression - PowerShell 7
        shell: pwsh
        run: .\scripts\test-phase7c-switch-position-array-source.ps1

      - name: Empty position array regression - Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-phase7c-switch-position-array-source.ps1
